      <div class="rangee mb4" style="gap:.5rem">${icone('cle',16,'var(--bleu)')}<h2 class="etiquette">Clé API Anthropic</h2></div>
      <label class="tpetit doux" for="champ-cle" style="display:block;margin-bottom:.5rem">
        Créez-la sur <code>console.anthropic.com</code>. Elle n’est envoyée qu’à l’API officielle d’Anthropic.</label>
      <div class="enveloppe">
        <input class="champ champ-cle" id="champ-cle" type="${Etat.cleVisible?'text':'password'}"
          value="${ech(Etat.cle)}" placeholder="sk-ant-…" autocomplete="off" autocorrect="off" spellcheck="false" />
        <button class="oeil" data-action="basculer-visibilite"
          aria-label="${Etat.cleVisible?'Masquer la clé':'Afficher la clé'}">${icone(Etat.cleVisible?'oeilBarre':'oeil',18)}</button>
      </div>
      ${Etat.cle ? `<p class="chiffres tpetit faible" style="margin-top:.5rem">Clé active : ${ech(apercuCle(Etat.cle))}</p>` : ''}
      <div class="rangee" style="gap:.5rem;margin-top:1rem">
        <button class="pilule plein" style="flex:1" data-action="enregistrer-cle">Enregistrer</button>
        <button class="pilule" style="flex:1;justify-content:center;background:var(--carte-clair);color:var(--texte);font-weight:600"
          data-action="tester-cle" id="bouton-test">Tester la connexion</button>
      </div>
      ${Etat.cle ? `<button class="pilule danger" style="width:100%;justify-content:center;margin-top:.5rem"
        data-action="effacer-cle">${icone('poubelle',15)} Effacer la clé</button>` : ''}
      <p id="retour-test" class="tpetit" role="status" style="margin-top:.75rem;color:${Etat.message && Etat.message.succes ? 'var(--bleu)' : 'var(--rouge)'}">${Etat.message ? ech(Etat.message.texte) : ''}</p>
    </section>

    <section class="carte p5 mb4">
      <h2 class="etiquette mb4">Conservation de la clé</h2>
      <div class="pile">
        ${modes.map(([v,titre,detail])=>`
          <button data-action="mode-conservation" data-valeur="${v}" aria-pressed="${actuel===v}"
            style="width:100%;text-align:left;border-radius:1rem;padding:1rem;border:1px solid ${actuel===v?'rgba(46,107,255,.45)':'var(--trait)'};
            background:${actuel===v?'rgba(14,27,60,.5)':'var(--carte-clair)'}">
            <span class="rangee" style="gap:.5rem">
              <span style="display:grid;place-items:center;height:1rem;width:1rem;flex-shrink:0;border-radius:999px;
                border:1px solid ${actuel===v?'var(--bleu)':'var(--faible)'}">
                ${actuel===v?'<span style="height:.5rem;width:.5rem;border-radius:999px;background:var(--bleu)"></span>':''}</span>
              <span style="font-size:.875rem;font-weight:600">${titre}</span></span>
            <span class="tpetit doux" style="display:block;margin-top:.5rem;padding-left:1.5rem">${detail}</span>
          </button>`).join('')}
      </div>
    </section>

    <section class="carte p5">
      <h2 class="etiquette mb4">Modèle Claude</h2>
      <input class="champ" id="champ-modele" type="text" value="${ech(Etat.modele)}"
        placeholder="${MODELE_DEFAUT}" aria-label="Identifiant du modèle Claude" spellcheck="false" />
      <p class="tpetit doux" style="margin-top:.75rem">Les noms de modèles évoluent : ce champ est la seule
      source de vérité de l’application. Vérifiez la liste à jour sur <code>docs.claude.com</code>.
      Valeur par défaut : <code>${MODELE_DEFAUT}</code>.</p>
      <button class="pilule plein" style="width:100%;margin-top:1rem" data-action="enregistrer-modele">Enregistrer le modèle</button>
    </section>` : ''}`;
}


/* ── 8. Navigation et rendu ────────────────────────────────── */

const ONGLETS = [
  {id:'accueil',      libelle:'Accueil',      icone:'accueil'},
  {id:'matchs',       libelle:'Matchs',       icone:'matchs'},
  {id:'competitions', libelle:'Compétitions', icone:'trophee'},
  {id:'actus',        libelle:'Actus',        icone:'actus'},
  {id:'compte',       libelle:'Compte',       icone:'compte'}
];

/** L'écran de prédiction reste rattaché à l'onglet Matchs. */
function ongletActif(){
  if(Etat.ecran==='prediction') return 'matchs';
  if(Etat.ecran==='parametres') return 'compte';
  return Etat.ecran;
}

function rendreOnglets(){
  const actif = ongletActif();
  document.getElementById('onglets').innerHTML = ONGLETS.map(o =>
    `<button class="${o.id===actif?'actif':''}" data-action="aller" data-ecran="${o.id}"
      ${o.id===actif?'aria-current="page"':''}>${icone(o.icone,20)}<span>${o.libelle}</span></button>`).join('');
}

const ECRANS = {
  accueil: ecranAccueil,
  matchs: ecranMatchs,
  competitions: ecranCompetitions,
  actus: ecranActus,
  compte: async () => ecranCompte(),
  parametres: async () => ecranParametres(),
  prediction: ecranPrediction
};

let rendus = 0;

async function rendre(){
  const conteneur = document.getElementById('ecran');
  const jeton = ++rendus;

  if(Etat.ecran==='prediction'){
    conteneur.innerHTML = enTete('Prédiction','',{retour:true}) +
      chargement(Etat.analyseIA && Etat.rechercheIA
        ? 'Calcul du modèle, puis recherche des données manquantes…'
        : 'Calcul du modèle statistique…');
    rendreOnglets();
  }

  try{
    const html = await (ECRANS[Etat.ecran] || ECRANS.accueil)();
    if(jeton !== rendus) return;              // un rendu plus récent a pris la main
    conteneur.innerHTML = html;
  }catch(e){
    if(jeton !== rendus) return;
    const brut = String(e && e.message || e);
    const message = /Failed to fetch|Load failed|NetworkError/i.test(brut)
      ? 'Impossible de joindre ESPN. Vérifiez votre connexion, puis réessayez.'
      : /ESPN a répondu/.test(brut)
        ? brut + ' La compétition est peut-être entre deux saisons.'
        : 'Cet écran n’a pas pu s’afficher. Réessayez ; si le problème persiste, rechargez la page.';
    conteneur.innerHTML = enTete('FootVision AI','',{reglages:true}) + etatErreur(message);
  }

  rendreOnglets();
  window.scrollTo({top:0, behavior:'instant'});
  const focus = document.querySelector('h1');
  if(focus) focus.setAttribute('tabindex','-1');
}

function aller(ecran, options={}){
  if(ecran==='matchs' && !options.garderCompetition) Etat.competitionActive = null;
  Etat.ecran = ecran;
  if(options.matchId) Etat.matchId = options.matchId;
  location.hash = ecran==='prediction' ? `#/match/${Etat.matchId}` : `#/${ecran}`;
  rendre();
}

function lireHash(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  if(h.startsWith('match/')){
    Etat.matchId = h.slice(6);
    Etat.ecran = 'prediction';
    return;
  }
  Etat.ecran = ECRANS[h] ? h : 'accueil';
}

/* ── 9. Interactions ───────────────────────────────────────── */

document.addEventListener('click', e => {
  const cible = e.target.closest('[data-action]');
  if(!cible) return;

  switch(cible.dataset.action){
    case 'aller':
      aller(cible.dataset.ecran);
      break;

    case 'retour':
      history.length > 1 ? history.back() : aller('accueil');
      break;

    case 'recharger':
      rendre();
      break;

    case 'ouvrir-match':
      Etat.matchId = cible.dataset.id;
      aller('prediction');
      break;

    case 'ouvrir-competition':
      Etat.competitionActive = cible.dataset.id;
      Etat.filtreMatch = 'tous';
      aller('matchs', {garderCompetition:true});
      break;

    case 'suivre': {
      const id = cible.dataset.id;
      const liste = Etat.suivies || [];
      Etat.suivies = liste.includes(id) ? liste.filter(x => x !== id) : [...liste, id];
      sauverSession();
      rendre();
      break;
    }

    case 'filtre-match':
      Etat.filtreMatch = cible.dataset.valeur;
      rendre();
      break;

    case 'filtre-competition':
      Etat.filtreCompetition = cible.dataset.valeur;
      rendre();
      break;

    case 'basculer-ia':
      Etat.analyseIA = !Etat.analyseIA;
      sauverSession();
      rendre();
      break;

    case 'basculer-avis':
      Etat.avisIA = !Etat.avisIA;
      sauverSession();
      rendre();
      break;

    case 'basculer-recherche':
      Etat.rechercheIA = !Etat.rechercheIA;
      sauverSession();
      rendre();
      break;

    case 'basculer-visibilite': {
      const champ = document.getElementById('champ-cle');
      if(champ) Etat.cle = champ.value;
      Etat.cleVisible = !Etat.cleVisible;
      rendre();
      break;
    }

    case 'enregistrer-cle': {
      const champ = document.getElementById('champ-cle');
      Etat.cle = champ ? champ.value.trim() : '';
      sauverSession();
      annoncer(Etat.cle ? 'Clé enregistrée.' : 'Aucune clé saisie.', !!Etat.cle);
      rendre();
      break;
    }

    case 'effacer-cle':
      Etat.cle = '';
      sauverSession();
      annoncer('Clé effacée.', true);
      rendre();
      break;

    case 'mode-conservation': {
      const champ = document.getElementById('champ-cle');
      if(champ) Etat.cle = champ.value.trim();
      Etat.conserver = cible.dataset.valeur === 'session';
      sauverSession();
      rendre();
      break;
    }

    case 'enregistrer-modele': {
      const champ = document.getElementById('champ-modele');
      Etat.modele = (champ && champ.value.trim()) || MODELE_DEFAUT;
      sauverSession();
      annoncer(`Modèle défini sur « ${Etat.modele} ».`, true);
      rendre();
      break;
    }

    case 'tester-cle':
      testerCle();
      break;
  }
});

/**
 * Message de retour dans l'écran Paramètres.
 * Il est mémorisé dans l'état : sans cela, un re-rendu déclenché juste après
 * effaçait le message avant même qu'il soit lisible.
 */
function annoncer(message, succes){
  Etat.message = message ? {texte:message, succes:!!succes} : null;
  const zone = document.getElementById('retour-test');
  if(!zone) return;
  zone.textContent = message || '';
  zone.style.color = succes ? 'var(--bleu)' : 'var(--rouge)';
}

/** Vérifie la clé avec l'appel le plus court possible. */
async function testerCle(){
  const champ = document.getElementById('champ-cle');
  const candidate = ((champ && champ.value.trim()) || Etat.cle).trim();
  const bouton = document.getElementById('bouton-test');

  if(!candidate) return annoncer('Saisissez d’abord une clé.', false);
  if(!candidate.startsWith('sk-ant-'))
    return annoncer('Format invalide : une clé Anthropic commence par « sk-ant- ».', false);

  if(bouton){ bouton.disabled = true; bouton.textContent = 'Test en cours…'; }

  try{
    const reponse = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key':candidate,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model: Etat.modele || MODELE_DEFAUT,
        max_tokens: 8,
        messages:[{role:'user', content:'Réponds uniquement : ok'}]
      })
    });

    if(reponse.ok){
      Etat.cle = candidate;
      sauverSession();
      annoncer(`Connexion établie avec le modèle ${Etat.modele}.`, true);
    } else {
      annoncer(await messageErreurApi(reponse), false);
    }
  }catch(e){
    annoncer(messageErreurReseau(e), false);
  }finally{
    if(bouton){ bouton.disabled = false; bouton.textContent = 'Tester la connexion'; }
  }
}

/* Recherche de compétition : filtrage sans perdre le focus du champ. */
document.addEventListener('input', e => {
  if(e.target.id === 'recherche'){
    Etat.recherche = e.target.value;
    clearTimeout(window.__minuteurRecherche);
    window.__minuteurRecherche = setTimeout(async () => {
      const html = await ecranCompetitions();
      document.getElementById('ecran').innerHTML = html;
      const champ = document.getElementById('recherche');
      if(champ){ champ.focus(); champ.setSelectionRange(champ.value.length, champ.value.length); }
    }, 180);
  }
});

/* Détail au survol d'une case de la matrice de scores. */
document.addEventListener('mouseover', e => {
  const c = e.target.closest('[data-action="survol-score"]');
  const zone = document.getElementById('detail-score');
  if(c && zone) zone.textContent = `${c.dataset.score} · ${Number(c.dataset.valeur).toFixed(2)} %`;
});
document.addEventListener('mouseout', e => {
  if(e.target.closest('[data-action="survol-score"]')){
    const zone = document.getElementById('detail-score');
    if(zone) zone.textContent = '49 issues modélisées';
  }
});

window.addEventListener('hashchange', () => { lireHash(); rendre(); });

/* ── 10. Démarrage ─────────────────────────────────────────── */

chargerSession();
appliquerSource();
lireHash();
rendre();

</script>
