<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />

<title>FootVision AI — Analyse et prédiction de matchs</title>
<meta name="description" content="Analyse probabiliste de matchs de football : moteur statistique local et lecture détaillée. Aucune garantie de résultat." />

<style>
/* ── Identité visuelle FootVision AI ───────────────────────── */
:root{
  --fond:#04060F; --carte:#0A0E1C; --carte-clair:#111729;
  --trait:rgba(255,255,255,.08);
  --bleu:#2E6BFF; --bleu-sombre:#0E1B3C; --bleu-vif:#5C93FF;
  --rouge:#E4123B; --rouge-sombre:#2E0A16;
  --ardoise:#6A7690;
  --texte:#F2F4F8; --doux:#8B96AD; --faible:#525C74;
  --display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --corps:'Inter',ui-sans-serif,system-ui,sans-serif;
  --pas:44px; --r:1.5rem;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{
  min-height:100dvh; overflow-x:hidden; max-width:100%; font-family:var(--corps); color:var(--texte);
  background-color:var(--fond); -webkit-font-smoothing:antialiased;
  /* Quadrillage fin : signature visuelle de l'application */
  background-image:
    linear-gradient(180deg,#0B1938 0%,#060A18 38%,#04060F 100%),
    linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:100% 100%,var(--pas) var(--pas),var(--pas) var(--pas);
  background-attachment:fixed;
}
main{max-width:42rem;margin:0 auto;max-width:min(42rem,100%);
  padding:calc(1rem + env(safe-area-inset-top)) 1rem 8.5rem}
::-webkit-scrollbar{width:0;height:0}
:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
code{background:rgba(0,0,0,.35);padding:.1em .35em;border-radius:4px;font-size:.9em;overflow-wrap:anywhere}
p,li,span{overflow-wrap:break-word}

.chiffres{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
.carte{border-radius:var(--r);border:1px solid var(--trait);background:rgba(11,16,13,.8);backdrop-filter:blur(6px);max-width:100%;overflow:hidden}
.carte-accent{border-radius:var(--r);border:1px solid rgba(46,107,255,.35);background:rgba(14,27,60,.25);max-width:100%;overflow:hidden}
.etiquette{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--doux);overflow-wrap:anywhere}
.p5{padding:1.25rem}.p4{padding:1rem}
.mb3{margin-bottom:.75rem}.mb4{margin-bottom:1rem}.mb5{margin-bottom:1.25rem}
.mt4{margin-top:1rem}.mt5{margin-top:1.25rem}
.pile>*+*{margin-top:.75rem}
.pile-l>*+*{margin-top:1rem}
.doux{color:var(--doux)}.faible{color:var(--faible)}
.petit{font-size:.75rem;line-height:1.6}
.tpetit{font-size:.68rem;line-height:1.55}
.display{font-family:var(--display);font-weight:700;letter-spacing:-.01em}
.centre{text-align:center}
.rangee{display:flex;align-items:center;gap:.75rem}
.entre{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.tronque{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deux-lignes{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* En-tête d'écran */
.entete{display:flex;align-items:center;gap:.75rem;padding-top:.5rem;margin-bottom:1.25rem}
.rond{display:grid;place-items:center;height:2.75rem;width:2.75rem;flex-shrink:0;border-radius:999px;
  border:1px solid var(--trait);background:var(--carte);color:var(--texte);transition:background .2s}
.rond:hover{background:var(--carte-clair)}
.entete h1{font-family:var(--display);font-size:1.25rem;font-weight:700}

/* Pilules et filtres */
.pilule{display:inline-flex;align-items:center;gap:.4rem;border-radius:999px;padding:.55rem .9rem;
  font-size:.875rem;font-weight:500;transition:all .2s;border:1px solid var(--trait);background:var(--carte);color:var(--doux)}
.pilule:hover{color:var(--texte)}
.pilule.actif{background:var(--bleu);border-color:var(--bleu);color:var(--fond);font-weight:600}
.pilule.plein{background:var(--bleu);border-color:var(--bleu);color:var(--fond);font-weight:600;justify-content:center}
.pilule.danger{border-color:rgba(228,18,59,.3);color:var(--rouge);background:none}
.pilule.danger:hover{background:rgba(228,18,59,.1)}
.pilule:disabled{opacity:.4;cursor:not-allowed}
.defile{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.25rem;scrollbar-width:none}
.defile>*{flex-shrink:0}

/* Barre de navigation fixe */
nav#barre{position:fixed;inset-inline:0;bottom:0;z-index:50;padding:0 .75rem max(.75rem,env(safe-area-inset-bottom))}
nav#barre>div{display:flex;max-width:32rem;margin:0 auto;align-items:center;justify-content:space-between;
  border-radius:999px;border:1px solid var(--trait);background:rgba(11,16,13,.85);padding:.375rem;
  box-shadow:0 18px 50px -18px rgba(0,0,0,.9);backdrop-filter:blur(18px)}
nav#barre button{display:flex;flex:1;flex-direction:column;align-items:center;gap:.25rem;
  border-radius:999px;padding:.5rem .25rem;color:var(--doux);transition:all .2s}
nav#barre button:hover{color:var(--texte)}
nav#barre button.actif{background:var(--bleu-sombre);color:var(--bleu)}
nav#barre span{font-size:.63rem;font-weight:600;letter-spacing:-.01em}

/* Équipes et logos */
.logo{display:grid;place-items:center;flex-shrink:0;border-radius:1rem;border:1px solid var(--trait);
  background:var(--carte-clair);font-family:var(--display);font-weight:700;color:var(--doux)}
.equipe-col{display:flex;min-width:0;flex:1;flex-direction:column;align-items:center;gap:.5rem;text-align:center}
.equipe-col span{font-size:.875rem;font-weight:600;line-height:1.25}

/* Barre 1X2 */
.barre-1x2{display:flex;height:.625rem;width:100%;gap:.25rem}
.barre-1x2 span{border-radius:999px;transition:width .5s}
.legende{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.375rem .75rem;font-size:.75rem;font-weight:500;margin-top:.75rem}
.legende b{display:inline-flex;align-items:center;gap:.375rem;font-weight:500}
.point{height:.375rem;width:.375rem;border-radius:999px}

/* Badges de forme */
.forme{display:flex;gap:.25rem}
.forme i{display:grid;place-items:center;height:1.5rem;width:1.5rem;border-radius:6px;border:1px solid;

.f-V{border-color:rgba(46,107,255,.45);background:var(--bleu-sombre);color:var(--bleu-vif)}
.f-N{border-color:rgba(106,118,144,.4);background:rgba(106,118,144,.12);color:var(--ardoise)}
.f-D{border-color:rgba(228,18,59,.4);background:var(--rouge-sombre);color:#FF6B85}

/* Matrice de scores — élément signature */
.matrice{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.matrice button{aspect-ratio:1;border-radius:5px;transition:transform .15s}
.matrice button:hover{transform:scale(1.12)}
.matrice button.retenu{box-shadow:0 0 0 1px var(--carte),0 0 0 2px var(--bleu-vif)}
.axe{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:.375rem;

/* Grilles */
.grille2{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem}
.grille3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;text-align:center}
.encart{border-radius:1rem;border:1px solid var(--trait);background:var(--carte-clair);padding:.875rem}

/* Champs */
.champ{width:100%;border-radius:1rem;border:1px solid var(--trait);background:var(--carte-clair);
  padding:.875rem 1rem;font-size:.875rem;color:var(--texte);transition:border-color .2s}
.champ:focus{border-color:rgba(46,107,255,.4);outline:none}
.champ::placeholder{color:var(--faible)}
.champ-cle{padding-right:3rem;font-family:ui-monospace,monospace}
.enveloppe{position:relative}
.oeil{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);display:grid;place-items:center;
  height:2.25rem;width:2.25rem;border-radius:.75rem;color:var(--doux)}
.oeil:hover{color:var(--texte)}

/* Bandeaux */
.bandeau{display:flex;align-items:flex-start;gap:.75rem;border-radius:var(--r);padding:.875rem}
.bandeau.rouge{border:1px solid rgba(228,18,59,.32);background:rgba(228,18,59,.08);color:#FF8CA0}
.bandeau.neutre{border:1px solid var(--trait);background:rgba(11,16,13,.6);color:var(--faible)}
.bandeau svg{flex-shrink:0;margin-top:.125rem}

/* Listes à puces */
.puces{list-style:none}
.puces li{display:flex;gap:.625rem;font-size:.75rem;line-height:1.6;color:var(--doux)}
.puces li+li{margin-top:.625rem}
.puces li::before{content:'';margin-top:.5rem;height:4px;width:4px;flex-shrink:0;border-radius:999px;background:var(--bleu)}
.puces.rouge li::before{background:var(--rouge)}

/* Jauge et progression */
.jauge{position:relative;height:84px;width:84px;flex-shrink:0}
.jauge svg{transform:rotate(-90deg)}
.jauge b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.5rem}
.progres{height:6px;width:100%;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.05)}
.progres span{display:block;height:100%;border-radius:999px;background:var(--bleu);transition:width .7s}

/* États */
.centre-vertical{display:flex;flex-direction:column;align-items:center;gap:.75rem;padding:3.5rem 1.5rem;text-align:center}
@keyframes tourne{to{transform:rotate(360deg)}}
.spin{animation:tourne 1s linear infinite;color:var(--bleu)}
@keyframes apparait{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.anim{animation:apparait .45s cubic-bezier(.22,1,.36,1) both}

/* Graphique de buts */
.barres{display:grid;grid-template-columns:repeat(6,1fr);gap:.5rem;align-items:end;height:150px}
.barres>div{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px}
.barres .paire{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%}
.barres .paire i{width:45%;border-radius:4px 4px 0 0;transition:height .6s;min-height:2px}
.barres .etq{text-align:center;font-size:.68rem;color:var(--doux);margin-top:.375rem}

@media (max-width:400px){ main{padding-left:.75rem;padding-right:.75rem} .grille2{gap:.5rem} }
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body>
<main id="ecran"></main>
<nav id="barre" aria-label="Navigation principale"><div id="onglets"></div></nav>
<script>
"use strict";
/* ═══════════════════════════════════════════════════════════
   FootVision AI — moteur, données et interface en un fichier.
   Toutes les probabilités sont calculées par le code ci-dessous.
   Claude n'intervient que pour rédiger l'explication.
   ═══════════════════════════════════════════════════════════ */

/* ── 1. Utilitaires ────────────────────────────────────────── */

const ICONES = {
  accueil:'M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5',
  matchs:'M8 2v20M16 2v20M3 12h18M3 6h5M3 18h5M16 6h5M16 18h5',
  trophee:'M6 4h12v5a6 6 0 0 1-12 0V4ZM6 6H3v2a3 3 0 0 0 3 3M18 6h3v2a3 3 0 0 1-3 3M9 21h6M12 15v6',
  actus:'M4 4h13v16H4zM17 8h3v9a3 3 0 0 1-3 3M7 8h7M7 12h7M7 16h4',
  compte:'M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 21a8 8 0 0 1 16 0',
  reglages:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z',
  retour:'m15 18-6-6 6-6',
  fleche:'M5 12h14M12 5l7 7-7 7',
  diagonale:'M7 17 17 7M7 7h10v10',
  cible:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20ZM12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12ZM12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z',
  valide:'M22 11.1V12a10 10 0 1 1-5.9-9.1M22 4 12 14.1l-3-3',
  alerte:'M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0ZM12 9v4M12 17h.01',
  info:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20ZM12 16v-4M12 8h.01',
  cle:'M15.5 7.5a4.5 4.5 0 1 1-6.4 4L2 19l3 3 1.5-1.5L5 19l2-2-1.5-1.5L7 14l4.5-4.5A4.5 4.5 0 0 1 15.5 7.5ZM16.5 7.5h.01',
  bouclier:'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10ZM9 12l2 2 4-4',
  poubelle:'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6',
  oeil:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7ZM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z',
  oeilBarre:'m2 2 20 20M6.7 6.7C3.9 8.4 2 12 2 12s4 7 10 7c2 0 3.8-.8 5.3-1.7M9.9 4.2A9.7 9.7 0 0 1 12 4c6 0 10 7 10 7a17 17 0 0 1-2.4 3.2M9.9 9.9a3 3 0 0 0 4.2 4.2',
  fiole:'M9 2v7.5L3.5 19A2 2 0 0 0 5.2 22h13.6a2 2 0 0 0 1.7-3L15 9.5V2M9 2h6M7.5 15h9',
  etoile:'m12 2 2.4 6.5L21 11l-6.6 2.5L12 20l-2.4-6.5L3 11l6.6-2.5L12 2Z',
  boite:'M22 12h-6l-2 3h-4l-2-3H2M5.5 5.5 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.5A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.5Z',
  loupe:'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM21 21l-4.3-4.3',
  utilisateurs:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',
  boussole:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Zm4.2-14.2-2.5 5.7-5.7 2.5 2.5-5.7 5.7-2.5Z',
  rafraichir:'M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5'
};

/** Rend une icône SVG inline. */
function icone(nom, taille, couleur){
  const d = ICONES[nom] || '';
  return `<svg width="${taille||18}" height="${taille||18}" viewBox="0 0 24 24" fill="none"
    stroke="${couleur||'currentColor'}" stroke-width="1.9" stroke-linecap="round"
    stroke-linejoin="round" aria-hidden="true">${d.split('M').filter(Boolean).map(p=>`<path d="M${p}"/>`).join('')}</svg>`;
}

/** Échappement systématique de tout texte injecté dans le DOM. */
function ech(valeur){
  return String(valeur ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

const borner = (v,min,max) => Math.min(max, Math.max(min, v));

/** Comparaison de noms insensible aux accents et à la casse. */
const normaliserNom = n => String(n||'')
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const arrondir = (v,d=2) => { const f = 10**d; return Math.round(v*f)/f; };

/** Arrondi de pourcentages à somme garantie (méthode des plus forts restes). */
function arrondirSomme(valeurs, total=100){
  if(!valeurs.length) return [];
  const somme = valeurs.reduce((a,b)=>a+b,0);
  const norm = somme>0 ? valeurs.map(v=>v/somme*total) : valeurs.map(()=>0);
  const bas = norm.map(Math.floor);
  let reste = total - bas.reduce((a,b)=>a+b,0);
  const ordre = norm.map((v,i)=>({i,r:v-Math.floor(v)})).sort((a,b)=>b.r-a.r);
  const sortie = bas.slice();
  let c = 0;
  while(reste>0 && ordre.length){ sortie[ordre[c%ordre.length].i]++; c++; reste--; }
  return sortie;
}

/* ── 2. Moteur statistique ─────────────────────────────────── */

const BUTS_MAX = 6;
const CONFIANCE_MAX = 90;        // Une prédiction n'est jamais une certitude.
const AVANTAGE_TERRAIN = 1.12;
const HANDICAP_EXTERIEUR = 0.96;
const MOYENNE_LIGUE_DEFAUT = 2.7;

/** Probabilité d'observer exactement k buts pour une intensité lambda. */
function poisson(k, lambda){
  if(lambda<=0) return k===0 ? 1 : 0;
  let f = 1;
  for(let i=2;i<=k;i++) f *= i;
  return Math.exp(-lambda) * lambda**k / f;
}

/** Correction Dixon-Coles : Poisson indépendant sous-estime les scores serrés. */
function correctionDC(d,e,lD,lE,rho){
  if(d===0&&e===0) return 1 - lD*lE*rho;
  if(d===0&&e===1) return 1 + lD*rho;
  if(d===1&&e===0) return 1 + lE*rho;
  if(d===1&&e===1) return 1 - rho;
  return 1;
}

/** Matrice complète des scores exacts, renormalisée à 1. */
function construireMatrice(lD, lE, rho=0.06){
  const m = []; let total = 0;
  for(let d=0; d<=BUTS_MAX; d++){
    const ligne = [];
    for(let e=0; e<=BUTS_MAX; e++){
      const v = Math.max(0, poisson(d,lD)*poisson(e,lE)*correctionDC(d,e,lD,lE,rho));
      ligne.push(v); total += v;
    }
    m.push(ligne);
  }
  if(total>0) for(let d=0;d<=BUTS_MAX;d++) for(let e=0;e<=BUTS_MAX;e++) m[d][e] /= total;
  return m;
}

/** Dérive tous les marchés depuis la matrice. Une seule source, zéro incohérence. */
function derriverMarches(m){
  let dom=0, nul=0, ext=0, bts=0, buts=0;
  let o05=0, o15=0, o25=0, o35=0;
  let blancDom=0, blancExt=0, marqueDom=0, marqueExt=0;

  for(let d=0; d<m.length; d++) for(let e=0; e<m[d].length; e++){
    const p = m[d][e], total = d + e;
    if(d>e) dom+=p; else if(d===e) nul+=p; else ext+=p;
    if(total>0.5) o05+=p;
    if(total>1.5) o15+=p;
    if(total>2.5) o25+=p;
    if(total>3.5) o35+=p;
    if(d>0 && e>0) bts+=p;
    if(e===0) blancDom+=p;      // l'équipe à domicile garde sa cage inviolée
    if(d===0) blancExt+=p;
    if(d>0) marqueDom+=p;
    if(e>0) marqueExt+=p;
    buts += p*total;
  }

  return {
    dom, nul, ext,
    over:o25, under:1-o25,
    over05:o05, over15:o15, over35:o35,
    btsOui:bts, btsNon:1-bts,
    blancDom, blancExt, marqueDom, marqueExt,
    butsTotal:arrondir(buts,2)
  };
}

/** Les n scores exacts les plus probables. */
function meilleursScores(m, n=3){
  const tous = [];
  for(let d=0; d<m.length; d++) for(let e=0; e<m[d].length; e++)
    tous.push({d, e, score:`${d}-${e}`, p:m[d][e]});
  return tous.sort((a,b)=>b.p-a.p).slice(0,n);
}

/** Forme pondérée : le match le plus récent pèse le plus lourd. */
function indiceForme(forme){
  if(!forme || !forme.length) return 0.5;
  const pts = {V:1, N:0.5, D:0};
  let num=0, den=0;
  forme.forEach((r,i)=>{ const w = 0.85**i; num += (pts[r] ?? 0.5)*w; den += w; });
  return den>0 ? num/den : 0.5;
}

/**
 * Rétrécissement vers la moyenne : sur un petit échantillon, un ratio extrême
 * est surtout du bruit. Un indice calculé sur 10 matchs ne compte que pour
 * 10/(10+K) de son écart à 1. Sans cela, le modèle produit des buts attendus
 * absurdes (4+) pour les équipes dominantes.
 */
const K_RETRECISSEMENT = 8;
function retrecir(indice, n){
  return 1 + (indice - 1) * (n / (n + K_RETRECISSEMENT));
}

/** Ratio attaque/défense normalisé par la moyenne de buts de la compétition. */
function forceBrute(s, moyenne, cote){
  const spec = cote==='domicile' ? s.domicile : s.exterieur;
  const matchs = spec?.matchs ?? s.matchsJoues;
  const pour = spec?.butsMarques ?? s.butsMarques;
  const contre = spec?.butsEncaisses ?? s.butsEncaisses;
  if(matchs<=0) return {attaque:1, defense:1};
  const ref = moyenne/2;
  return {
    attaque: borner(retrecir(pour/matchs/ref, matchs), 0.45, 1.85),
    defense: borner(retrecir(contre/matchs/ref, matchs), 0.45, 1.85)
  };
}

/** Mélange avec les expected goals (45 %) quand la source les fournit. */
function melangerXg(base, s, moyenne){
  if(s.xgPour==null || s.xgContre==null || s.matchsJoues<=0) return {valeur:base, utilise:false};
  const ref = moyenne/2, n = s.matchsJoues;
  const aXg = borner(retrecir(s.xgPour/n/ref, n), 0.45, 1.85);
  const dXg = borner(retrecir(s.xgContre/n/ref, n), 0.45, 1.85);
  return {valeur:{attaque:base.attaque*0.55+aXg*0.45, defense:base.defense*0.55+dXg*0.45}, utilise:true};
}

function correctionClassement(rang, rangAdverse){
  if(rang==null || rangAdverse==null) return 1;
  return borner(1 + (rangAdverse-rang)*0.012, 0.88, 1.14);
}

/** Absences : un attaquant absent affaiblit l'attaque, un défenseur la solidité. */
function impactAbsences(absences, equipeId){
  const liste = absences.filter(a=>a.equipeId===equipeId);
  let attaque=1, defense=1;
  liste.forEach(a=>{
    const w = a.importance ?? 0.5;
    const poste = (a.poste||'').toLowerCase();
    const off = /att|ail|avant|forward|winger|striker|milieu off/.test(poste);
    const def = /def|arr|gardien|goal|keeper|back|centr/.test(poste);
    if(off) attaque *= 1 - 0.09*w;
    else if(def) defense *= 1 + 0.08*w;
    else { attaque *= 1 - 0.04*w; defense *= 1 + 0.04*w; }
  });
  return {attaque:borner(attaque,0.7,1), defense:borner(defense,1,1.35), nombre:liste.length};
}

/** Fatigue : peu de repos ou calendrier chargé pénalise l'attaque. */
function impactFatigue(s){
  let c = 1;
  if(s.joursRepos!=null){
    if(s.joursRepos<=2) c *= 0.93;
    else if(s.joursRepos===3) c *= 0.97;
    else if(s.joursRepos>=7) c *= 1.02;
  }
  if(s.matchsRecents14j!=null && s.matchsRecents14j>=5) c *= 0.96;
  return borner(c, 0.85, 1.05);
}

/** Confrontations directes, plafonnées à 12 % d'influence. */
function biaisConfrontations(confrontations, domicileId){
  const liste = (confrontations||[]).slice(0,6);
  if(!liste.length) return {domicile:1, exterieur:1, nombre:0};
  let bd=0, be=0;
  liste.forEach(c=>{
    const chezSoi = c.domicileId===domicileId;
    bd += chezSoi ? c.butsDomicile : c.butsExterieur;
    be += chezSoi ? c.butsExterieur : c.butsDomicile;
  });
  const ref = 1.35;
  const w = Math.min(liste.length/6, 1) * 0.12;
  return {
    domicile: borner(1 + (bd/liste.length/ref - 1)*w, 0.85, 1.18),
    exterieur: borner(1 + (be/liste.length/ref - 1)*w, 0.85, 1.18),
    nombre: liste.length
  };
}

/** Calcule les intensités de buts attendues pour les deux équipes. */
function calculerForces(dossier){
  const {statsDomicile:sD, statsExterieur:sE, absences, confrontations, match} = dossier;
  const moyenne = dossier.moyenneButsCompetition ?? MOYENNE_LIGUE_DEFAUT;
  const sources = ['buts marqués et encaissés','forme récente','avantage du terrain'];

  const xD = melangerXg(forceBrute(sD, moyenne, 'domicile'), sD, moyenne);
  const xE = melangerXg(forceBrute(sE, moyenne, 'exterieur'), sE, moyenne);
  if(xD.utilise || xE.utilise) sources.push('expected goals');

  const fD = indiceForme(sD.forme), fE = indiceForme(sE.forme);
  const cfD = borner(1 + (fD-0.5)*0.2, 0.9, 1.1);
  const cfE = borner(1 + (fE-0.5)*0.2, 0.9, 1.1);

  const clD = correctionClassement(sD.classement, sE.classement);
  const clE = correctionClassement(sE.classement, sD.classement);
  if(sD.classement!=null) sources.push('classement');

  const aD = impactAbsences(absences, match.domicile.id);
  const aE = impactAbsences(absences, match.exterieur.id);
  if(aD.nombre + aE.nombre > 0) sources.push('absences déclarées');

  const ftD = impactFatigue(sD), ftE = impactFatigue(sE);
  if(sD.joursRepos!=null || sE.joursRepos!=null) sources.push('repos et calendrier');

  const h2h = biaisConfrontations(confrontations, match.domicile.id);
  if(h2h.nombre>0) sources.push('confrontations directes');

  const ref = moyenne/2;

  // Noyau Poisson : force offensive × faiblesse défensive adverse × avantage du terrain.
  const noyauD = ref * xD.valeur.attaque * xE.valeur.defense * AVANTAGE_TERRAIN;
  const noyauE = ref * xE.valeur.attaque * xD.valeur.defense * HANDICAP_EXTERIEUR;

  /**
   * Les correctifs (forme, classement, absences, fatigue, historique) sont
   * amortis par une racine et bornés : multipliés bruts, ils se cumulent et
   * font exploser le résultat. Aucun ne doit peser plus de ±20 % au total.
   */
  const amortir = produit => borner(Math.pow(produit, 0.45), 0.82, 1.2);
  const ajD = amortir(cfD * clD * ftD * h2h.domicile * aE.defense * aD.attaque);
  const ajE = amortir(cfE * clE * ftE * h2h.exterieur * aD.defense * aE.attaque);

  // Plafond dur : aucune équipe n'a une espérance réaliste au-delà de 3,4 buts.
  const lambdaDomicile = borner(noyauD * ajD, 0.15, 3.4);
  const lambdaExterieur = borner(noyauE * ajE, 0.15, 3.4);

  return {
    lambdaDomicile: arrondir(lambdaDomicile,3),
    lambdaExterieur: arrondir(lambdaExterieur,3),
    sources: [...new Set(sources)]
  };
}

/** Note la complétude du dossier : moins de données, moins de confiance. */
function evaluerQualite(dossier){
  const manquants = [...(dossier.champsManquants||[])];
  const d = dossier.statsDomicile, e = dossier.statsExterieur;
  const controles = [
    [d.matchsJoues>=5 && e.matchsJoues>=5, 'historique de saison suffisant'],
    [d.forme.length>=5 && e.forme.length>=5, 'forme sur 5 matchs'],
    [!!d.domicile && !!e.exterieur, 'forme à domicile / à l’extérieur'],
    [d.xgPour!=null && e.xgPour!=null, 'expected goals'],
    [d.classement!=null && e.classement!=null, 'classement'],
    [dossier.confrontations.length>0, 'confrontations directes'],
    [dossier.absences.length>0, 'absences et blessures'],
    [dossier.joueursDomicile.length>0 && dossier.joueursExterieur.length>0, 'effectifs'],
    [d.joursRepos!=null && e.joursRepos!=null, 'jours de récupération'],
    [d.tirsParMatch!=null && e.tirsParMatch!=null, 'tirs et tirs cadrés']
  ];
  let ok = 0;
  controles.forEach(([test, libelle])=>{
    if(test) ok++;
    else if(!manquants.includes(libelle)) manquants.push(libelle);
  });
  return {score: Math.round(ok/controles.length*100), manquants};
}

/**
 * Indice de confiance sur 100 : netteté du signal et qualité des données.
 * Jamais une garantie de résultat, et plafonné à 90.
 */
function calculerConfiance(probas, qualite, coherence){
  const trie = [probas.dom, probas.nul, probas.ext].sort((a,b)=>b-a);
  const nettete   = borner((trie[0]-trie[1])/45*60, 0, 60);
  const domination= borner((trie[0]-33.3)/40*20, 0, 20);
  const fiabilite = qualite/100*25;
  const coh       = borner(coherence*10, -5, 5);
  const plafond   = 35 + qualite/100*55;
  return Math.round(borner(nettete+domination+fiabilite+coh, 5, Math.min(CONFIANCE_MAX, plafond)));
}

function libelleForme(forme){
  if(!forme || !forme.length) return 'donnée indisponible';
  const v = forme.filter(r=>r==='V').length;
  const n = forme.filter(r=>r==='N').length;
  const d = forme.filter(r=>r==='D').length;
  const i = indiceForme(forme);
  const t = i>=0.75 ? 'dynamique très favorable'
          : i>=0.58 ? 'bonne dynamique'
          : i>=0.42 ? 'dynamique irrégulière'
          : i>=0.25 ? 'dynamique fragile' : 'série difficile';
  return `${v}V ${n}N ${d}D sur ${forme.length} matchs — ${t}`;
}

function titreScenario(d, e, nomD, nomE){
  const ecart = d - e, total = d + e;
  if(ecart===0) return {
    titre: total===0 ? 'Match verrouillé, aucun but' : `Match nul en ${d}-${e}`,
    explication: total===0
      ? 'Les deux blocs défensifs se neutralisent et aucune attaque ne trouve la faille.'
      : 'Les deux équipes se répondent : chaque ouverture du score est suivie d’une égalisation.'
  };
  const vainqueur = ecart>0 ? nomD : nomE;
  const lieu = ecart>0 ? 'à domicile' : 'à l’extérieur';
  const marge = Math.abs(ecart);
  if(marge===1) return {
    titre: `Courte victoire de ${vainqueur} ${lieu}`,
    explication: `${vainqueur} fait la différence sur un détail et gère la fin de match sans marge de sécurité.`
  };
  if(marge===2) return {
    titre: `${vainqueur} s’impose nettement ${lieu}`,
    explication: `${vainqueur} prend le contrôle et double la mise, ce qui met le match hors de portée.`
  };
  return {
    titre: `Large succès de ${vainqueur} ${lieu}`,
    explication: `Domination franche : ${vainqueur} multiplie les occasions face à une défense dépassée.`
  };
}

/**
 * Buteurs probables, calculés à partir du temps de jeu et du rendement réel.
 * Le taux de buts par minute de chaque joueur est projeté sur ses minutes
 * attendues, puis l'ensemble est calé sur les buts attendus de l'équipe :
 * la somme des espérances individuelles vaut exactement lambda.
 * Aucune estimation ne vient du modèle de langage.
 */
function estimerButeurs(dossier, lambdaD, lambdaE){
  // Un joueur blessé ou suspendu ne peut pas marquer : il sort de la liste,
  // et sa part est automatiquement redistribuée aux autres.
  const indisponibles = new Set();
  (dossier.absences||[]).forEach(a => {
    if(a.joueurId) indisponibles.add(String(a.joueurId));
    if(a.nom) indisponibles.add(normaliserNom(a.nom));
  });

  const pourEquipe = (joueurs, lambda, nomEquipe, stats) => {
    const matchsEquipe = Math.max(1, stats.matchsJoues);
    const candidats = (joueurs||[])
      .filter(j => j.butsSaison!=null && j.butsSaison>0)
      .filter(j => !indisponibles.has(String(j.id)) && !indisponibles.has(normaliserNom(j.nom)))
      .map(j => {
        // Deux bases possibles selon ce que la source publie.
        let part;
        if(j.minutes!=null && j.minutes>=180){
          // Rendement par minute projeté sur ses minutes habituelles.
          const minutesAttendues = Math.min(90, j.minutes / matchsEquipe);
          part = (j.butsSaison / j.minutes) * minutesAttendues;
        } else {
          // Minutes non publiées : on retombe sur les buts par match d'équipe.
          part = j.butsSaison / matchsEquipe;
        }
        // Une composition annoncée resserre l'estimation.
        const facteur = j.titulaire===true ? 1.2 : j.titulaire===false ? 0.45 : 1;
        return {joueur:j, part: part * facteur};
      })
      .filter(x => x.part > 0);

    const total = candidats.reduce((a,x) => a + x.part, 0);
    if(total <= 0) return [];

    return candidats.map(({joueur:j, part}) => {
      const lambdaJoueur = lambda * (part / total);
      return {
        id: j.id, nom: j.nom, equipe: nomEquipe, poste: j.poste || null,
        butsAttendus: arrondir(lambdaJoueur, 2),
        // Probabilité de marquer au moins une fois, loi de Poisson.
        probabilite: Math.round((1 - Math.exp(-lambdaJoueur)) * 100),
        butsSaison: j.butsSaison,
        passes: j.passes ?? null,
        minutes: j.minutes ?? null,
        titulaire: j.titulaire ?? null
      };
    }).sort((a,b) => b.butsAttendus - a.butsAttendus).slice(0, 5);
  };

  return {
    domicile: pourEquipe(dossier.joueursDomicile, lambdaD, dossier.match.domicile.nom, dossier.statsDomicile),
    exterieur: pourEquipe(dossier.joueursExterieur, lambdaE, dossier.match.exterieur.nom, dossier.statsExterieur)
  };
}

/** Moteur hybride complet. Aucune valeur numérique ne vient du modèle. */
function executerMoteur(dossier){
  const forces = calculerForces(dossier);
  const matrice = construireMatrice(forces.lambdaDomicile, forces.lambdaExterieur);
  const bruts = derriverMarches(matrice);

  const [pDom,pNul,pExt] = arrondirSomme([bruts.dom, bruts.nul, bruts.ext], 100);
  const [over,under]     = arrondirSomme([bruts.over, bruts.under], 100);
  const [btsOui,btsNon]  = arrondirSomme([bruts.btsOui, bruts.btsNon], 100);
  const pct = v => Math.round(v*100);

  const scenarios = meilleursScores(matrice, 3).map((s,i)=>{
    const {titre, explication} = titreScenario(s.d, s.e, dossier.match.domicile.nom, dossier.match.exterieur.nom);
    return {rang:i+1, score:s.score, probabilite:arrondir(s.p*100,1), titre, explication};
  });

  const qualite = evaluerQualite(dossier);
  const ecartForme = indiceForme(dossier.statsDomicile.forme) - indiceForme(dossier.statsExterieur.forme);
  const signe = pDom>pExt ? 1 : pExt>pDom ? -1 : 0;
  const coherence = signe===0 ? 0 : (Math.sign(ecartForme)===signe ? 0.5 : -0.5);
  const confiance = calculerConfiance({dom:pDom, nul:pNul, ext:pExt}, qualite.score, coherence);

  const favori = (pDom>pExt && pDom>pNul) ? dossier.match.domicile
               : (pExt>pDom && pExt>pNul) ? dossier.match.exterieur : null;

  return {
    matchId: dossier.match.id,
    probabilites: {dom:pDom, nul:pNul, ext:pExt},
    confiance,
    favori,
    butsAttendus: {domicile:arrondir(forces.lambdaDomicile,2), exterieur:arrondir(forces.lambdaExterieur,2)},
    totalButs: bruts.butsTotal,
    scenarios,
    marches: {
      over25:over, under25:under, btsOui, btsNon,
      over05: pct(bruts.over05), over15: pct(bruts.over15), over35: pct(bruts.over35),
      blancDom: pct(bruts.blancDom), blancExt: pct(bruts.blancExt),
      marqueDom: pct(bruts.marqueDom), marqueExt: pct(bruts.marqueExt),
      // Doubles chances : recalculées sur les valeurs arrondies, donc cohérentes.
      domOuNul: pDom + pNul, domOuExt: pDom + pExt, nulOuExt: pNul + pExt
    },
    buteurs: estimerButeurs(dossier, forces.lambdaDomicile, forces.lambdaExterieur),
    matrice: matrice.map(l=>l.map(v=>arrondir(v*100,2))),
    qualite,
    sources: forces.sources,
    analyseForme: {
      domicile: libelleForme(dossier.statsDomicile.forme),
      exterieur: libelleForme(dossier.statsExterieur.forme)
    },
    donneesFictives: dossier.donneesFictives,
    avertissement: 'Cette analyse est probabiliste et ne garantit en aucun cas le résultat du match.'
  };
}

function paliersConfiance(i){
  if(i>=80) return {libelle:'Confiance très élevée', couleur:'#2E6BFF'};
  if(i>=65) return {libelle:'Confiance élevée',      couleur:'#5C93FF'};
  if(i>=45) return {libelle:'Confiance moyenne',     couleur:'#9AA6C0'};
  return      {libelle:'Confiance faible',           couleur:'#E4123B'};
}

function decrireStats(prefixe, s, cote){
  const spec = cote==='domicile' ? s.domicile : s.exterieur;
  const ind = (v,u='') => v==null ? 'donnée indisponible' : `${v}${u}`;
  return [
    prefixe,
    `- Matchs joués : ${s.matchsJoues}, buts marqués : ${s.butsMarques}, encaissés : ${s.butsEncaisses}`,
    spec ? `- Bilan ${cote} : ${spec.matchs} matchs, ${spec.butsMarques} marqués, ${spec.butsEncaisses} encaissés`
         : `- Bilan ${cote} : donnée indisponible`,
    `- Forme (du plus récent au plus ancien) : ${s.forme.length ? s.forme.join(' ') : 'donnée indisponible'}`,
    `- Classement : ${ind(s.classement)}, points : ${ind(s.points)}`,
    `- Possession moyenne : ${ind(s.possessionMoyenne,' %')}`,
    `- Tirs par match : ${ind(s.tirsParMatch)}, cadrés : ${ind(s.tirsCadresParMatch)}`,
    `- xG pour : ${ind(s.xgPour)}, xG contre : ${ind(s.xgContre)}`,
    `- Cartons jaunes : ${ind(s.cartonsJaunes)}, rouges : ${ind(s.cartonsRouges)}`,
    `- Jours de repos : ${ind(s.joursRepos)}, matchs sur 14 jours : ${ind(s.matchsRecents14j)}`
  ].join('\n');
}

function listerJoueurs(joueurs, nomEquipe){
  if(!joueurs.length) return `${nomEquipe} : effectif non fourni par la source de données.`;
  return `${nomEquipe} :\n` + joueurs.slice(0,18).map(j=>{
    const d = [j.poste || 'poste indisponible',
      j.butsSaison!=null ? `${j.butsSaison} buts` : null,
      j.passes!=null ? `${j.passes} passes D` : null,
      j.butsRecents!=null ? `${j.butsRecents} buts sur 5 matchs` : null,
      j.minutes!=null ? `${j.minutes} min` : null,
      j.titulaire ? 'titulaire probable' : null].filter(Boolean).join(', ');
    return `- [${j.id}] ${j.nom} — ${d}`;
  }).join('\n');
}

function extraireJson(brut){
  const t = brut.replace(/^\s*```(?:json)?/i,'').replace(/```\s*$/,'').trim();
  try{ return JSON.parse(t); }
  catch{
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if(a===-1 || b<=a) throw new Error('Réponse du modèle illisible.');
    return JSON.parse(t.slice(a, b+1));
  }
}

/** Validation manuelle stricte : toute réponse non conforme est rejetée. */
function validerAnalyse(brut, dossier){
  const chaine = (v,min,max) => typeof v==='string' && v.trim().length>=min && v.length<=max;
  if(!brut || typeof brut!=='object') throw new Error('Réponse vide.');
  if(!chaine(brut.narration,40,2200)) throw new Error('Narration invalide.');
  if(!Array.isArray(brut.scenarios) || brut.scenarios.length!==3) throw new Error('Scénarios invalides.');
  brut.scenarios.forEach(s=>{
    if(!Number.isInteger(s.rang) || s.rang<1 || s.rang>3) throw new Error('Rang invalide.');
    if(!chaine(s.titre,5,120) || !chaine(s.explication,20,700)) throw new Error('Scénario invalide.');
  });
  const listes = ['facteursCles','facteursRisque'];
  listes.forEach(k=>{
    if(!Array.isArray(brut[k]) || !brut[k].length || brut[k].length>7) throw new Error(k + ' invalide.');
    brut[k].forEach(f=>{ if(!chaine(f,5,260)) throw new Error(k + ' invalide.'); });
  });
  if(!brut.forme || !chaine(brut.forme.domicile,10,400) || !chaine(brut.forme.exterieur,10,400))
    throw new Error('Analyse de forme invalide.');

  // Garde-fou : tout joueur absent des données réelles est retiré.
  const connus = new Set([...dossier.joueursDomicile, ...dossier.joueursExterieur].map(j=>j.id));
  const joueurs = (Array.isArray(brut.joueursDecisifs) ? brut.joueursDecisifs : [])
    .filter(j => j && connus.has(j.id) && chaine(j.nom,1,80) && chaine(j.raison,10,400))
    .slice(0,6)
    .map(j => ({...j, influence: borner(Number(j.influence) || 0, 0, 100)}));

  return {
    narration: brut.narration,
    scenarios: brut.scenarios,
    joueursDecisifs: joueurs,
    facteursCles: brut.facteursCles,
    facteursRisque: brut.facteursRisque,
    forme: brut.forme
  };
}

/**
 * Message d'erreur exploitable, construit à partir de la réponse d'Anthropic.
 * Le corps d'erreur de l'API ne contient jamais la clé : on peut l'afficher.
 */
async function messageErreurApi(reponse){
  let detail = '';
  try{
    const corps = await reponse.json();
    detail = corps?.error?.message || '';
  }catch{ /* corps illisible */ }

  const suffixe = detail ? ` — ${detail}` : '';
  if(reponse.status===401) return 'Clé Anthropic refusée (401).' + suffixe;
  if(reponse.status===403) return 'Accès refusé (403). La clé n’a peut-être pas les droits requis.' + suffixe;
  if(reponse.status===404) return `Modèle « ${Etat.modele} » introuvable (404). Corrigez-le dans Paramètres.` + suffixe;
  if(reponse.status===400) return `Requête refusée (400). Souvent : nom de modèle invalide, ou modèle indisponible sur ce compte.` + suffixe;
  if(reponse.status===429) return 'Limite de débit atteinte (429). Réessayez dans un instant.' + suffixe;
  return `Erreur ${reponse.status} côté API.` + suffixe;
}

/** Distingue un blocage navigateur d'une vraie panne réseau. */
function messageErreurReseau(e){
  const brut = String(e && e.message || e);
  if(/Failed to fetch|Load failed|NetworkError|TypeError/i.test(brut)){
    return 'Requête bloquée par le navigateur avant d’atteindre Anthropic. '
      + 'Vérifiez votre connexion, désactivez un éventuel bloqueur de contenu, '
      + 'et confirmez que la page est bien servie en HTTPS.';
  }
  if(/JSON|illisible|invalide/i.test(brut)){
    return 'Le modèle a répondu dans un format inattendu. Les probabilités calculées restent valides.';
  }
  return 'Analyse rédigée indisponible. Les probabilités calculées restent valides.';
}

/**
 * Appel direct à l'API Anthropic depuis le navigateur.
 * Ce mode est imposé par la contrainte « un seul fichier » : sans serveur,
 * la clé transite forcément depuis le poste de l'utilisateur.
 * Elle n'est envoyée qu'à api.anthropic.com et à aucun autre domaine.
 */
/**
 * Cible et en-têtes de l'appel Claude.
 * Avec un proxy, la clé reste sur le serveur et ne transite jamais par le navigateur.
 */
function cibleClaude(cle){
  const base = (Etat.proxy || '').replace(/\/+$/, '');
  if(base){
    const entetes = {'content-type':'application/json'};
    if(Etat.jetonProxy) entetes['x-jeton'] = Etat.jetonProxy;
    return {url: base + '/claude', entetes, viaProxy:true};
  }
  return {
    url: 'https://api.anthropic.com/v1/messages',
    entetes: {
      'content-type':'application/json',
      'x-api-key': cle,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    viaProxy:false
  };
}

async function analyserAvecClaude(dossier, resultat){
  // Les chiffres n'en dépendent pas : couper la rédaction n'enlève aucune valeur calculée.
  if(!Etat.analyseIA) return {analyse:null, message:null};

  const cle = Etat.cle.trim();
  const cible = cibleClaude(cle);

  if(!cible.viaProxy){
    if(!cle) return {analyse:null, message:'Aucune clé Anthropic saisie : seule l’analyse statistique est affichée.'};
    if(!cle.startsWith('sk-ant-')) return {analyse:null, message:'Format de clé invalide (une clé Anthropic commence par « sk-ant- »).'};
  }

  try{
    const reponse = await fetch(cible.url, {
      method:'POST',
      headers: cible.entetes,
      body: JSON.stringify({
        model: Etat.modele || MODELE_DEFAUT,
        max_tokens: 2400,
        // Pas d'amorce « assistant » : certains modèles la refusent.
        // Le JSON est obtenu par la consigne système et extrait de façon tolérante.
        system: CONSIGNE_SYSTEME,
        messages:[{role:'user', content: construireInvite(dossier, resultat)}]
      })
    });

    if(!reponse.ok) return {analyse:null, message: await messageErreurApi(reponse)};

    const corps = await reponse.json();
    const texte = (corps.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    if(!texte) return {analyse:null, message:'Le modèle n’a renvoyé aucun texte. Les probabilités calculées restent valides.'};
    return {analyse: validerAnalyse(extraireJson(texte), dossier), message:null};
  }catch(e){
    return {analyse:null, message: messageErreurReseau(e)};
  }
}

const CLE_STOCKAGE = 'footvision.session';

function chargerSession(){
  try{
    const brut = sessionStorage.getItem(CLE_STOCKAGE);
    if(!brut) return;
    const d = JSON.parse(brut);
    if(typeof d.cle==='string') { Etat.cle = d.cle; Etat.conserver = true; }
    if(typeof d.modele==='string' && d.modele) Etat.modele = d.modele;
    if(d.source==='reelle' || d.source==='proxy') Etat.source = d.source;
    if(typeof d.proxy==='string') Etat.proxy = d.proxy;
    if(typeof d.cleFoot==='string') Etat.cleFoot = d.cleFoot;
    if(Array.isArray(d.suivies)) Etat.suivies = d.suivies;
    if(d.analyseIA === false) Etat.analyseIA = false;
    if(typeof d.jetonProxy==='string') Etat.jetonProxy = d.jetonProxy;
    if(typeof d.proxy==='string') Etat.proxy = d.proxy;
    if(typeof d.cleFoot==='string') Etat.cleFoot = d.cleFoot;
    if(Array.isArray(d.suivies)) Etat.suivies = d.suivies;
    if(d.analyseIA === false) Etat.analyseIA = false;
  }catch{ /* stockage indisponible : on continue sans */ }
}

function sauverSession(){
  try{
    // Le choix de la source et la compétition par défaut sont anodins :
    // on les conserve toujours. La clé, elle, uniquement sur demande explicite.
    const donnees = {source:Etat.source, ligueDefaut:Etat.ligueDefaut, modele:Etat.modele,
                     proxy:Etat.proxy, jetonProxy:Etat.jetonProxy,
                     suivies:Etat.suivies, analyseIA:Etat.analyseIA,
                     cleFoot:Etat.cleFoot};
    if(Etat.conserver) donnees.cle = Etat.cle;
    sessionStorage.setItem(CLE_STOCKAGE, JSON.stringify(donnees));
  }catch{ /* stockage indisponible : on continue sans */ }
}

function apercuCle(cle){

  return c.length<=10 ? '••••••••' : c.slice(0,7) + '…' + c.slice(-4);

/** Comparaison insensible aux accents, à la casse et à la ponctuation. */
function normaliser(texte){
  return String(texte||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}

/** Une compétition correspond si son nom contient tous les mots-clés. */
function vedettePour(nom){
  const n = normaliser(nom);
  return LIGUES_VEDETTES.find(v => v.cles.every(c => n.includes(normaliser(c)))) || null;
}

/** Compétitions suivies par défaut au premier lancement. */
const SUIVIES_PAR_DEFAUT = [
  ['french','ligue 1'], ['english','premier league'], ['spanish','la liga'],
  ['italian','serie a'], ['german','bundesliga'], ['portuguese','primeira'],
  ['brazilian','serie a'], ['uefa','champions league']
];

const cacheSdb = new Map();

async function sdbAppel(chemin){
  if(cacheSdb.has(chemin)) return cacheSdb.get(chemin);
  const reponse = await fetch(SDB_BASE + chemin);
  if(reponse.status===429) throw new Error('Quota TheSportsDB atteint. Patientez une minute.');
  if(!reponse.ok) throw new Error(`TheSportsDB a répondu ${reponse.status}.`);
  const corps = await reponse.json();
  cacheSdb.set(chemin, corps);
  return corps;
}

/** Saisons à essayer : format européen puis année civile (Brésil, MLS…). */
function saisonsCandidates(){
  const d = new Date(), a = d.getFullYear(), m = d.getMonth() + 1;
  const debut = m >= 7 ? a : a - 1;   // une saison européenne démarre l'été
  return [`${debut}-${debut+1}`, `${a}`, `${debut-1}-${debut}`, `${a-1}`];
}

function codeCourt(nom){
  const mots = String(nom||'').replace(/[^A-Za-zÀ-ÿ ]/g,'').trim().split(/\s+/);
  if(mots.length>=2) return (mots[0][0] + mots[1][0] + (mots[2]?mots[2][0]:mots[0][1]||'')).toUpperCase();
  return String(nom||'???').slice(0,3).toUpperCase();
}

function sdbNombre(v){
  if(v===null || v===undefined || v==='') return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function sdbDate(e){
  if(e.strTimestamp) return e.strTimestamp.includes('T')
    ? (e.strTimestamp.endsWith('Z') ? e.strTimestamp : e.strTimestamp + 'Z')
    : e.strTimestamp.replace(' ','T') + 'Z';
  const heure = (e.strTime && e.strTime !== '00:00:00') ? e.strTime : '00:00:00';
  return `${e.dateEvent}T${heure}Z`;
}

function sdbVersMatch(e){
  const bd = sdbNombre(e.intHomeScore), be = sdbNombre(e.intAwayScore);
  return {
    id: String(e.idEvent),
    date: sdbDate(e),
    statut: (bd!==null && be!==null) ? 'termine' : 'a_venir',
    competition: {
      id: String(e.idLeague),
      nom: e.strLeague || 'Compétition',
      pays: e.strCountry || '',
      codePays: (e.strCountry || '').slice(0,3).toUpperCase(),
      type: 'ligue'
    },
    domicile: {id:String(e.idHomeTeam), nom:e.strHomeTeam||'Équipe', nomCourt:codeCourt(e.strHomeTeam)},
    exterieur:{id:String(e.idAwayTeam), nom:e.strAwayTeam||'Équipe', nomCourt:codeCourt(e.strAwayTeam)},
    scoreDomicile: bd,
    scoreExterieur: be,
    importance: null,
    stade: e.strVenue || null
  };
}

/**
 * Une seule requête par compétition ramène toute la saison.
 * Forme, buts, splits domicile/extérieur et confrontations directes
 * sont ensuite reconstruits localement, sans requête supplémentaire.
 */
async function sdbSaison(ligueId){
  const cle = 'saison:' + ligueId;
  if(cacheSdb.has(cle)) return cacheSdb.get(cle);

  let resultat = {matchs:[], bruts:[], saison:null};
  for(const saison of saisonsCandidates()){
    const corps = await sdbAppel(`eventsseason.php?id=${encodeURIComponent(ligueId)}&s=${saison}`);
    const evenements = Array.isArray(corps.events) ? corps.events : [];
    if(evenements.length){
      // Les événements bruts sont conservés : ils contiennent parfois
      // le détail des buteurs, seule source individuelle sans proxy.
      resultat = {matchs: evenements.map(sdbVersMatch), bruts: evenements, saison};
      break;
    }
  }
  cacheSdb.set(cle, resultat);
  return resultat;
}

async function sdbClassement(ligueId, saison){
  if(!saison) return new Map();
  try{
    const corps = await sdbAppel(`lookuptable.php?l=${encodeURIComponent(ligueId)}&s=${saison}`);
    const table = new Map();
    (corps.table || []).forEach(l => table.set(String(l.idTeam), {
      rang: sdbNombre(l.intRank), points: sdbNombre(l.intPoints)
    }));
    return table;
  }catch{ return new Map(); }
}

/** Reconstruit les statistiques d'une équipe à partir des matchs joués. */
function sdbStats(matchs, equipeId){
  const stats = {
    matchsJoues:0, butsMarques:0, butsEncaisses:0,
    domicile:{matchs:0, butsMarques:0, butsEncaisses:0},
    exterieur:{matchs:0, butsMarques:0, butsEncaisses:0},
    forme:[], classement:null, points:null,
    possessionMoyenne:null, tirsParMatch:null, tirsCadresParMatch:null,
    xgPour:null, xgContre:null, cartonsJaunes:null, cartonsRouges:null,
    joursRepos:null, matchsRecents14j:null
  };

  const joues = matchs
    .filter(m => m.statut==='termine' && (m.domicile.id===equipeId || m.exterieur.id===equipeId))
    .sort((a,b) => b.date.localeCompare(a.date));

  const maintenant = Date.now();
  let dernier = null, recents = 0;

  joues.forEach(m => {
    const chezSoi = m.domicile.id===equipeId;
    const pour   = chezSoi ? m.scoreDomicile : m.scoreExterieur;
    const contre = chezSoi ? m.scoreExterieur : m.scoreDomicile;

    stats.matchsJoues++;
    stats.butsMarques += pour;
    stats.butsEncaisses += contre;
    const bloc = chezSoi ? stats.domicile : stats.exterieur;
    bloc.matchs++; bloc.butsMarques += pour; bloc.butsEncaisses += contre;

    if(stats.forme.length < 10) stats.forme.push(pour>contre ? 'V' : pour===contre ? 'N' : 'D');

    const t = Date.parse(m.date);
    if(Number.isFinite(t)){
      if(maintenant - t <= 14*86400e3 && t <= maintenant) recents++;
      if(dernier===null || t>dernier) dernier = t;
    }
  });

  stats.matchsRecents14j = recents;
  stats.joursRepos = dernier!==null ? Math.max(0, Math.round((maintenant-dernier)/86400e3)) : null;
  return stats;
}

/**
 * TheSportsDB publie parfois le détail des buts dans strHomeGoalDetails /
 * strAwayGoalDetails, sous des formes variables : « 23':Nom », « Nom 23' »,
 * séparées par des points-virgules. Le format n'est pas garanti et le champ
 * est vide pour beaucoup de compétitions : l'analyse le signale alors
 * plutôt que de combler le vide.
 */
function sdbExtraireButeurs(detail){
  if(!detail || typeof detail !== 'string') return [];
  return detail.split(/[;\n]+/)
    .map(bloc => bloc.trim())
    .filter(Boolean)
    .map(bloc => {
      // On retire la minute, le symbole prime et les mentions de penalty.
      const nom = bloc
        .replace(/\d+\s*[+']\s*\d*/g, ' ')
        .replace(/[:\-–]/g, ' ')
        .replace(/\((pen|og|csc|penalty)\.?\)/ig, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      return nom;
    })
    .filter(nom => nom.length >= 3 && /[A-Za-zÀ-ÿ]{3}/.test(nom));
}

/** Agrège les buteurs d'une équipe sur toute la saison. */
function sdbButeursEquipe(bruts, equipeId){
  const compte = new Map();
  (bruts||[]).forEach(e => {
    const chezSoi = String(e.idHomeTeam) === equipeId;
    const dehors  = String(e.idAwayTeam) === equipeId;
    if(!chezSoi && !dehors) return;
    const detail = chezSoi ? e.strHomeGoalDetails : e.strAwayGoalDetails;
    sdbExtraireButeurs(detail).forEach(nom => compte.set(nom, (compte.get(nom)||0) + 1));
  });

  return [...compte.entries()]
    .map(([nom, buts]) => ({
      id: `${equipeId}:${nom}`,
      nom,
      poste: null,
      equipeId,
      butsSaison: buts,
      passes: null,
      minutes: null,        // non publiées par cette source
      butsRecents: null,
      titulaire: null
    }))
    .sort((a,b) => b.butsSaison - a.butsSaison);
}

const FournisseurSportsDB = {
  nom: 'TheSportsDB (données réelles)',
  fictif: false,

  async listerCompetitions(){
    const corps = await sdbAppel('all_leagues.php');
    const toutes = (corps.leagues || [])
      .filter(l => l.strSport === 'Soccer')
      .map(l => ({
        id: String(l.idLeague),
        nom: l.strLeague || 'Compétition',
        pays: l.strLeagueAlternate || '',
        codePays: '',
        type: /cup|coupe|copa|trophy/i.test(l.strLeague||'') ? 'coupe' : 'ligue'
      }));

    // Les grandes compétitions d'abord, avec leur pays lisible.
    toutes.forEach(c => {
      const vedette = vedettePour(c.nom);
      if(vedette){ c.pays = vedette.pays; c.codePays = vedette.code; c.vedette = true; }
    });
    const rang = c => {
      const i = LIGUES_VEDETTES.findIndex(v => v === vedettePour(c.nom));
      return i === -1 ? 999 : i;
    };
    return toutes.sort((a,b) => rang(a) - rang(b) || a.nom.localeCompare(b.nom));
  },

  /**
   * Compétitions interrogées quand aucune n'est sélectionnée.
   * L'utilisateur choisit les siennes depuis l'écran Compétitions ;
   * à défaut, une sélection de huit grandes compétitions s'applique.
   */
  async liguesSuivies(){
    if(Array.isArray(Etat.suivies) && Etat.suivies.length) return Etat.suivies.slice(0, 12);
    if(Etat.liguesSuivies) return Etat.liguesSuivies;

    const toutes = await this.listerCompetitions();
    Etat.liguesSuivies = SUIVIES_PAR_DEFAUT
      .map(cles => toutes.find(c => {
        const n = normaliser(c.nom);
        return cles.every(mot => n.includes(normaliser(mot)));
      }))
      .filter(Boolean)
      .map(c => c.id);
    return Etat.liguesSuivies;
  },

  async listerMatchs(competitionId){
    const ligues = competitionId ? [competitionId] : await this.liguesSuivies();
    if(!ligues.length) return [];

    // Toutes les compétitions suivies sont interrogées en parallèle,
    // puis fusionnées : sinon un seul championnat occupe tout l'écran.
    const lots = await Promise.all(ligues.map(id =>
      sdbSaison(id).then(r => r.matchs).catch(() => [])
    ));
    const matchs = lots.flat();
    const maintenant = Date.now();

    const aVenir = matchs
      .filter(m => m.statut==='a_venir' && Date.parse(m.date) >= maintenant - 6*3600e3)
      .sort((a,b) => a.date.localeCompare(b.date))
      .slice(0, competitionId ? 40 : 40);

    // S'il n'y a rien à venir (intersaison), on montre les derniers résultats.
    const passes = matchs
      .filter(m => m.statut==='termine')
      .sort((a,b) => b.date.localeCompare(a.date))
      .slice(0, aVenir.length ? 15 : 30);

    return [...aVenir, ...passes];
  },

  async obtenirMatch(id){
    for(const cle of cacheSdb.keys()){
      if(!cle.startsWith('saison:')) continue;
      const trouve = cacheSdb.get(cle).matchs.find(m => m.id === id);
      if(trouve) return trouve;
    }
    const ligues = await this.liguesSuivies();
    for(const ligueId of ligues){
      const {matchs} = await sdbSaison(ligueId);
      const trouve = matchs.find(m => m.id === id);
      if(trouve) return trouve;
    }
    return null;
  },

  async construireDossier(id){
    const match = await this.obtenirMatch(id);
    if(!match) return null;

    const {matchs, bruts, saison} = await sdbSaison(match.competition.id);
    const joues = matchs.filter(m => m.statut==='termine');

    const buteursDomicile  = sdbButeursEquipe(bruts, match.domicile.id);
    const buteursExterieur = sdbButeursEquipe(bruts, match.exterieur.id);

    const statsDomicile  = sdbStats(matchs, match.domicile.id);
    const statsExterieur = sdbStats(matchs, match.exterieur.id);

    const classement = await sdbClassement(match.competition.id, saison);
    const rD = classement.get(match.domicile.id), rE = classement.get(match.exterieur.id);
    if(rD){ statsDomicile.classement = rD.rang; statsDomicile.points = rD.points; }
    if(rE){ statsExterieur.classement = rE.rang; statsExterieur.points = rE.points; }

    const confrontations = joues
      .filter(m =>
        (m.domicile.id===match.domicile.id && m.exterieur.id===match.exterieur.id) ||
        (m.domicile.id===match.exterieur.id && m.exterieur.id===match.domicile.id))
      .sort((a,b) => b.date.localeCompare(a.date))
      .slice(0,6)
      .map(m => ({
        date: m.date, domicileId: m.domicile.id, exterieurId: m.exterieur.id,
        butsDomicile: m.scoreDomicile, butsExterieur: m.scoreExterieur
      }));

    // Moyenne de buts réellement observée dans la compétition.
    const moyenne = joues.length
      ? joues.reduce((a,m) => a + m.scoreDomicile + m.scoreExterieur, 0) / joues.length
      : null;

    const manquants = [
      'expected goals (non fournis par TheSportsDB)',
      'absences, blessures et suspensions',
      'compositions probables',
      'possession, tirs et tirs cadrés'
    ];
    if(!buteursDomicile.length && !buteursExterieur.length){
      manquants.push('buteurs (détail des buts non publié pour cette compétition)');
    } else {
      manquants.push('temps de jeu des joueurs');
    }
    if(!rD || !rE) manquants.push('classement');

    return {
      match, statsDomicile, statsExterieur,
      joueursDomicile: buteursDomicile,
      joueursExterieur: buteursExterieur,
      absences: [], confrontations,
      moyenneButsCompetition: moyenne,
      champsManquants: manquants,
      donneesFictives: false
    };
  },

  async listerActualites(){ return []; }
};

   Elle fournit calendrier, scores en direct, classements, compositions

const ESPN_DEFAUT = ['fra.1','uefa.champions','uefa.europa','eng.1','esp.1','ita.1','ger.1','bra.1'];

const cacheEspn = new Map();
const ESPN_PREFIXE = 'footvision.espn.';

/** Cache disque court : ESPN n'impose pas de quota, on ménage juste le réseau. */
function espnCacheLire(cle){
  try{
    const brut = localStorage.getItem(ESPN_PREFIXE + cle);
    if(!brut) return null;
    const {expire, valeur} = JSON.parse(brut);
    if(Date.now() > expire){ localStorage.removeItem(ESPN_PREFIXE + cle); return null; }
    return valeur;
  }catch{ return null; }
}

function espnCacheEcrire(cle, valeur, duree){
  try{
    localStorage.setItem(ESPN_PREFIXE + cle, JSON.stringify({expire: Date.now()+duree, valeur}));
  }catch{
    try{
      Object.keys(localStorage).filter(k => k.startsWith(ESPN_PREFIXE)).slice(0, 40)
        .forEach(k => localStorage.removeItem(k));
    }catch{}
  }
}

async function espnAppel(url, duree = 10*60e3){
  if(cacheEspn.has(url)) return cacheEspn.get(url);
  const memorise = espnCacheLire(url);
  if(memorise){ cacheEspn.set(url, memorise); return memorise; }

  const reponse = await fetch(url);
  if(!reponse.ok) throw new Error(`ESPN a répondu ${reponse.status}.`);
  const corps = await reponse.json();
  cacheEspn.set(url, corps);
  espnCacheEcrire(url, corps, duree);
  return corps;
}

const espnObjet  = v => (typeof v==='object' && v!==null) ? v : {};
const espnTab    = v => Array.isArray(v) ? v : [];
const espnNombre = v => {
  if(typeof v==='number' && Number.isFinite(v)) return v;
  if(typeof v==='string' && v.trim()!=='' && Number.isFinite(Number(v))) return Number(v);
  return null;
};

function espnJour(decalage = 0){
  const d = new Date(Date.now() + decalage*86400e3);
  return d.toISOString().slice(0,10).replace(/-/g,'');
}

/** Saison ESPN : année de début pour les compétitions européennes. */
function espnSaison(){
  const d = new Date();
  return d.getMonth()+1 >= 7 ? d.getFullYear() : d.getFullYear()-1;
}

function espnCompetition(slug){
  return ESPN_COMPETITIONS.find(c => c.slug === slug)
    || {slug, nom:slug, pays:'', code:'', type:'ligue'};
}

/** Un identifiant de match porte sa compétition, pour pouvoir la retrouver. */
function espnVersMatch(evenement, slug){
  const comp = espnObjet(espnTab(evenement.competitions)[0]);
  const equipes = espnTab(comp.competitors).map(espnObjet);
  const dom = equipes.find(e => e.homeAway === 'home') || espnObjet(equipes[0]);
  const ext = equipes.find(e => e.homeAway === 'away') || espnObjet(equipes[1]);
  const etat = espnObjet(espnObjet(comp.status).type).state;
  const infos = espnCompetition(slug);

  const versEquipe = c => {
    const t = espnObjet(c.team);
    const nom = t.displayName || t.name || 'Équipe';
    return {
      id: String(t.id || ''),
      nom,
      nomCourt: (t.abbreviation || t.shortDisplayName || nom.slice(0,3)).toUpperCase().slice(0,4),
      logo: t.logo || null,
      forme: String(c.form || '')
    };
  };

  return {
    id: `${slug}:${evenement.id}`,
    date: evenement.date || new Date().toISOString(),
    statut: etat === 'post' ? 'termine' : etat === 'in' ? 'en_cours' : 'a_venir',
    competition: {id:slug, nom:infos.nom, pays:infos.pays, codePays:infos.code, type:infos.type},
    domicile: versEquipe(dom),
    exterieur: versEquipe(ext),
    scoreDomicile: espnNombre(dom.score),
    scoreExterieur: espnNombre(ext.score),
    importance: null,
    stade: espnObjet(comp.venue).fullName || null
  };
}

/** Calendrier d'une compétition sur une fenêtre glissante. */
async function espnCalendrier(slug){
  const debut = espnJour(-10), fin = espnJour(21);
  const url = `${ESPN_SITE}/${slug}/scoreboard?dates=${debut}-${fin}&limit=300`;
  const corps = await espnAppel(url, 15*60e3);
  return espnTab(corps.events).map(e => espnVersMatch(espnObjet(e), slug));
}

/** Résultats d'une équipe sur la saison, pour la forme et les splits. */
async function espnHistoriqueEquipe(slug, equipeId){
  try{
    const url = `${ESPN_SITE}/${slug}/teams/${equipeId}/schedule?season=${espnSaison()}`;
    const corps = await espnAppel(url, 6*3600e3);
    return espnTab(corps.events).map(e => espnVersMatch(espnObjet(e), slug));
  }catch{ return []; }
}

function espnStats(matchs, equipeId){
  const stats = {
    matchsJoues:0, butsMarques:0, butsEncaisses:0,
    domicile:{matchs:0,butsMarques:0,butsEncaisses:0},
    exterieur:{matchs:0,butsMarques:0,butsEncaisses:0},
    forme:[], classement:null, points:null,
    possessionMoyenne:null, tirsParMatch:null, tirsCadresParMatch:null,
    xgPour:null, xgContre:null, cartonsJaunes:null, cartonsRouges:null,
    joursRepos:null, matchsRecents14j:null
  };

  const joues = matchs
    .filter(m => m.statut==='termine' && m.scoreDomicile!=null && m.scoreExterieur!=null)
    .filter(m => m.domicile.id===equipeId || m.exterieur.id===equipeId)
    .sort((a,b) => b.date.localeCompare(a.date));

  const maintenant = Date.now();
  let dernier = null, recents = 0;

  joues.forEach(m => {
    const chezSoi = m.domicile.id===equipeId;
    const pour   = chezSoi ? m.scoreDomicile : m.scoreExterieur;
    const contre = chezSoi ? m.scoreExterieur : m.scoreDomicile;

    stats.matchsJoues++; stats.butsMarques += pour; stats.butsEncaisses += contre;
    const bloc = chezSoi ? stats.domicile : stats.exterieur;
    bloc.matchs++; bloc.butsMarques += pour; bloc.butsEncaisses += contre;

    if(stats.forme.length < 10) stats.forme.push(pour>contre ? 'V' : pour===contre ? 'N' : 'D');

    const t = Date.parse(m.date);
    if(Number.isFinite(t)){
      if(t <= maintenant && maintenant - t <= 14*86400e3) recents++;
      if(dernier===null || t>dernier) dernier = t;
    }
  });

  stats.matchsRecents14j = recents;
  stats.joursRepos = dernier!==null ? Math.max(0, Math.round((maintenant-dernier)/86400e3)) : null;
  return stats;
}

async function espnClassement(slug){
  const table = new Map();
  try{
    const corps = await espnAppel(`${ESPN_CORE}/${slug}/standings?season=${espnSaison()}`, 6*3600e3);
    const groupes = espnTab(corps.children).length ? espnTab(corps.children) : [corps];
    groupes.forEach(g => {
      espnTab(espnObjet(espnObjet(g).standings).entries).forEach(e => {
        const entree = espnObjet(e);
        const equipe = espnObjet(entree.team);
        const lire = nom => {
          const st = espnTab(entree.stats).map(espnObjet).find(x => x.name===nom || x.type===nom);
          return st ? espnNombre(st.value) : null;
        };
        table.set(String(equipe.id), {rang: lire('rank'), points: lire('points')});
      });
    });
  }catch{ /* coupes sans classement */ }
  return table;
}

/**
 * Détail d'une rencontre : compositions, buteurs, possession et tirs.
 * Les compositions ne sont publiées qu'à l'approche du coup d'envoi.
 */
async function espnDetail(slug, evenementId){
  try{
    return await espnAppel(`${ESPN_SITE}/${slug}/summary?event=${evenementId}`, 8*60e3);
  }catch{ return null; }
}

/** Statistiques individuelles de la saison, quand ESPN les expose. */
async function espnJoueurs(slug, equipeId){
  const essais = [
    `${ESPN_WEB}/${slug}/statistics/byathlete?season=${espnSaison()}&limit=200&team=${equipeId}`,
    `${ESPN_SITE}/${slug}/teams/${equipeId}/roster`
  ];
  for(const url of essais){
    try{
      const corps = await espnAppel(url, 12*3600e3);

      // Format « byathlete » : catégories de statistiques par joueur.
      const athletes = espnTab(espnObjet(corps.athletes).items).length
        ? espnTab(espnObjet(corps.athletes).items)
        : espnTab(corps.athletes);

      const joueurs = athletes.map(a => {
        const bloc = espnObjet(a);
        const ath = espnObjet(bloc.athlete || bloc);
        const categories = espnTab(bloc.categories).map(espnObjet);
        const lire = nom => {
          for(const c of categories){
            const noms = espnTab(c.names), valeurs = espnTab(c.values);
            const i = noms.indexOf(nom);
            if(i !== -1) return espnNombre(valeurs[i]);
          }
          return null;
        };
        return {
          id: String(ath.id || ''),
          nom: ath.displayName || ath.fullName || 'Joueur',
          poste: espnObjet(ath.position).displayName || espnObjet(ath.position).abbreviation || null,
          equipeId: String(equipeId),
          butsSaison: lire('totalGoals') ?? lire('goals'),
          passes: lire('goalAssists') ?? lire('assists'),
          minutes: lire('minutes') ?? lire('appearances'),
          butsRecents: null,
          titulaire: null
        };
      }).filter(j => j.id && j.butsSaison != null);

      if(joueurs.length) return joueurs;
    }catch{ /* format indisponible, on tente le suivant */ }
  }
  return [];
}

const FournisseurEspn = {
  nom: 'ESPN (sans clé, sans quota)',
  fictif: false,

  async listerCompetitions(){
    return ESPN_COMPETITIONS.map(c => ({
      id:c.slug, nom:c.nom, pays:c.pays, codePays:c.code, type:c.type
    }));
  },

  async liguesSuivies(){
    return (Array.isArray(Etat.suivies) && Etat.suivies.length)
      ? Etat.suivies.slice(0, 12)
      : ESPN_DEFAUT;
  },

  async listerMatchs(competitionId){
    const slugs = competitionId ? [competitionId] : await this.liguesSuivies();
    const lots = await Promise.all(slugs.map(s => espnCalendrier(s).catch(() => [])));
    const tous = lots.flat();
    const maintenant = Date.now();

    const aVenir = tous.filter(m => m.statut!=='termine' && Date.parse(m.date) >= maintenant - 4*3600e3)
      .sort((a,b) => a.date.localeCompare(b.date));
    const passes = tous.filter(m => m.statut==='termine')
      .sort((a,b) => b.date.localeCompare(a.date))
      .slice(0, aVenir.length ? 12 : 30);

    return [...aVenir.slice(0, 50), ...passes];
  },

  async obtenirMatch(id){
    const [slug] = String(id).split(':');
    const liste = await espnCalendrier(slug).catch(() => []);
    return liste.find(m => m.id === id) || null;
  },

  async construireDossier(id){
    const [slug, evenementId] = String(id).split(':');
    const match = await this.obtenirMatch(id);
    if(!match) return null;

    const [histoDom, histoExt, classement, detail] = await Promise.all([
      espnHistoriqueEquipe(slug, match.domicile.id),
      espnHistoriqueEquipe(slug, match.exterieur.id),
      espnClassement(slug),
      espnDetail(slug, evenementId)
    ]);

    const statsDomicile  = espnStats(histoDom, match.domicile.id);
    const statsExterieur = espnStats(histoExt, match.exterieur.id);

    const rD = classement.get(match.domicile.id), rE = classement.get(match.exterieur.id);
    if(rD){ statsDomicile.classement = rD.rang; statsDomicile.points = rD.points; }
    if(rE){ statsExterieur.classement = rE.rang; statsExterieur.points = rE.points; }

    const manquants = ['expected goals (non publiés par ESPN)'];

    // Compositions annoncées, si ESPN les a déjà publiées.
    const titulaires = new Map();
    let schemas = null;
    if(detail){
      espnTab(detail.rosters).map(espnObjet).forEach(bloc => {
        const equipeId = String(espnObjet(bloc.team).id);
        const noms = new Set();
        espnTab(bloc.roster).map(espnObjet).forEach(j => {
          if(j.starter) noms.add(String(espnObjet(j.athlete).id));
        });
        if(noms.size){
          titulaires.set(equipeId, noms);
          if(bloc.formation) schemas = (schemas||{}), schemas[equipeId] = bloc.formation;
        }
      });
    }
    if(!titulaires.size) manquants.push('compositions probables (publiées à l’approche du coup d’envoi)');
    manquants.push('liste officielle des blessés et suspendus');

    const [joueursDomicile, joueursExterieur] = await Promise.all([
      espnJoueurs(slug, match.domicile.id),
      espnJoueurs(slug, match.exterieur.id)
    ]);
    if(!joueursDomicile.length && !joueursExterieur.length){
      manquants.push('statistiques individuelles des joueurs');
    }

    const marquerTitulaires = (liste, equipeId) => {
      const noms = titulaires.get(equipeId);
      return noms ? liste.map(j => ({...j, titulaire: noms.has(j.id)})) : liste;
    };

    // Confrontations directes fournies par ESPN dans le détail du match.
    const confrontations = espnTab(espnObjet(detail || {}).headToHeadGames)
      .flatMap(b => espnTab(espnObjet(b).events).map(espnObjet))
      .map(e => {
        const score = String(e.score || '');
        const buts = score.match(/(\d+)\s*-\s*(\d+)/);
        if(!buts) return null;
        return {
          date: e.gameDate || e.date || '',
          domicileId: match.domicile.id,
          exterieurId: match.exterieur.id,
          butsDomicile: Number(buts[1]),
          butsExterieur: Number(buts[2])
        };
      })
      .filter(Boolean)
      .slice(0, 6);
    if(!confrontations.length) manquants.push('confrontations directes');

    // Moyenne de buts réellement observée dans la compétition.
    const joues = [...histoDom, ...histoExt].filter(m => m.statut==='termine' && m.scoreDomicile!=null);
    const moyenne = joues.length
      ? joues.reduce((a,m) => a + m.scoreDomicile + m.scoreExterieur, 0) / joues.length
      : null;

    return {
      match,
      statsDomicile, statsExterieur,
      joueursDomicile: marquerTitulaires(joueursDomicile, match.domicile.id),
      joueursExterieur: marquerTitulaires(joueursExterieur, match.exterieur.id),
      absences: [],
      confrontations,
      moyenneButsCompetition: moyenne,
      champsManquants: manquants,
      donneesFictives: false,
      schemas
    };
  },

  async listerActualites(){ return []; }
};

/* ── 5 ter. Fournisseur API-Football ────────────────────────────
   Source complète : calendrier, classements, compositions, blessures,
   suspensions, temps de jeu et statistiques individuelles, sur plus de
   mille compétitions.

   Elle accepte les appels directs depuis un navigateur : sa documentation
   autorise explicitement les requêtes GET portant le seul en-tête
   x-apisports-key. Aucun proxy n'est nécessaire.

   En contrepartie la clé est visible dans la page. Restreignez-la à votre
   domaine depuis le tableau de bord api-sports.io : elle devient alors
   inutilisable ailleurs. Un proxy reste possible et prend le dessus s'il
   est renseigné.
   ─────────────────────────────────────────────────────────── */

const AF_DIRECT = 'https://v3.football.api-sports.io';

/**
 * Cache persistant sur disque (localStorage), avec durée de vie par type
 * de donnée. C'est ce qui rend le quota gratuit de 100 requêtes par jour
 * réellement utilisable : un calendrier déjà chargé ne recoûte rien,
 * et réanalyser un match revu dans la journée est gratuit.
 */
const AF_DUREES = [
  [/^\/leagues/,             7*24*3600e3],  // la liste des compétitions bouge très peu
  [/^\/fixtures\/headtohead/, 7*24*3600e3],  // l'historique est figé
  [/^\/players/,               24*3600e3],
  [/^\/standings/,             12*3600e3],
  [/^\/teams\/statistics/,      6*3600e3],
  [/^\/fixtures/,               2*3600e3],  // calendrier et scores
  [/^\/injuries/,               30*60e3],   // les forfaits tombent en continu
  [/^\/fixtures\/lineups/,      10*60e3]    // compositions ~1 h avant le match
];
const AF_DUREE_DEFAUT = 3600e3;

function afDuree(chemin){
  const trouve = AF_DUREES.find(([motif]) => motif.test(chemin));
  return trouve ? trouve[1] : AF_DUREE_DEFAUT;
}

const AF_PREFIXE = 'footvision.cache.';
const AF_COMPTEUR = 'footvision.requetes';

function afLireCache(cle){
  try{
    const brut = localStorage.getItem(AF_PREFIXE + cle);
    if(!brut) return null;
    const {expire, valeur} = JSON.parse(brut);
    if(Date.now() > expire){ localStorage.removeItem(AF_PREFIXE + cle); return null; }
    return valeur;
  }catch{ return null; }
}

function afEcrireCache(cle, valeur, duree){
  try{
    localStorage.setItem(AF_PREFIXE + cle, JSON.stringify({expire: Date.now() + duree, valeur}));
  }catch(e){
    // Quota de stockage plein : on purge les entrées les plus anciennes.
    afPurgerCache(0.5);
    try{ localStorage.setItem(AF_PREFIXE + cle, JSON.stringify({expire: Date.now()+duree, valeur})); }catch{}
  }
}

/** Supprime les entrées expirées, et une fraction du reste si demandé. */
function afPurgerCache(fraction = 0){
  try{
    const cles = Object.keys(localStorage).filter(k => k.startsWith(AF_PREFIXE));
    const restantes = [];
    cles.forEach(k => {
      try{
        const {expire} = JSON.parse(localStorage.getItem(k));
        if(Date.now() > expire) localStorage.removeItem(k);
        else restantes.push({k, expire});
      }catch{ localStorage.removeItem(k); }
    });
    if(fraction > 0){
      restantes.sort((a,b) => a.expire - b.expire)
        .slice(0, Math.ceil(restantes.length * fraction))
        .forEach(e => localStorage.removeItem(e.k));
    }
  }catch{ /* stockage indisponible */ }
}

/** Compteur quotidien, pour que la consommation reste visible. */
function afCompter(){
  try{
    const jour = new Date().toISOString().slice(0,10);
    const brut = JSON.parse(localStorage.getItem(AF_COMPTEUR) || '{}');
    const total = (brut.jour === jour ? brut.total : 0) + 1;
    localStorage.setItem(AF_COMPTEUR, JSON.stringify({jour, total}));
    return total;
  }catch{ return 0; }
}

function afRequetesDuJour(){
  try{
    const jour = new Date().toISOString().slice(0,10);
    const brut = JSON.parse(localStorage.getItem(AF_COMPTEUR) || '{}');
    return brut.jour === jour ? brut.total : 0;
  }catch{ return 0; }
}

 * Identifiants API-Football des compétitions les plus suivies.
 * Ils sont stables dans le temps chez ce fournisseur.
 */

  61,  62,   // Ligue 1, Ligue 2
  2,   3,    // Ligue des champions, Ligue Europa
  848,       // Ligue Conférence
  39,  40,   // Premier League, Championship
  140, 141,  // La Liga, La Liga 2
  135, 136,  // Serie A, Serie B
  78,  79,   // Bundesliga, 2. Bundesliga
  94,  88,   // Primeira Liga, Eredivisie
  144, 203,  // Jupiler Pro League, Süper Lig
