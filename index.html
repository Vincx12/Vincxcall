const AF_SUIVIES_DEFAUT = [61, 2, 39, 140, 135, 78, 94, 71];
const cacheAf = new Map();

/** Appel direct par défaut, via le proxy si l'utilisateur en a configuré un. */
function afCible(chemin){
  const p = (Etat.proxy || '').trim().replace(/\/+$/,'');
  if(p) return {base: p + '/football' + chemin, entetes: {}};

  const cle = (Etat.cleFoot || '').trim();
  if(!cle) throw new Error('Clé API-Football manquante. Renseignez-la dans Paramètres.');
  // L'API n'accepte qu'un seul en-tête : tout ajout provoquerait un refus.
  return {base: AF_DIRECT + chemin, entetes: {'x-apisports-key': cle}};
}

async function afAppel(chemin, parametres = {}){
  const {base, entetes} = afCible(chemin);
  const url = new URL(base);
  Object.entries(parametres).forEach(([k,v]) => { if(v!=null) url.searchParams.set(k, String(v)); });
  const cle = url.toString();
  if(cacheAf.has(cle)) return cacheAf.get(cle);

  // Le cache disque évite de rappeler l'API pour une donnée déjà connue.
  const memorise = afLireCache(cle);
  if(memorise){ cacheAf.set(cle, memorise); return memorise; }

  afCompter();
  const reponse = await fetch(url, {method:'GET', headers: entetes});
  if(reponse.status===429) throw new Error('Quota API-Football atteint pour aujourd’hui.');
  if(reponse.status===401 || reponse.status===403){
    throw new Error('Clé API-Football refusée. Vérifiez-la, et si vous l’avez restreinte à un domaine, que celui-ci correspond bien.');
  }
  if(!reponse.ok) throw new Error(`API-Football a répondu ${reponse.status} pour ${chemin}.`);

  const corps = await reponse.json();
  const erreurs = corps && corps.errors;
  if(erreurs && (Array.isArray(erreurs) ? erreurs.length : Object.keys(erreurs).length)){
    const detail = Array.isArray(erreurs) ? erreurs[0] : Object.values(erreurs)[0];
    throw new Error(`API-Football : ${detail}`);
  }
  cacheAf.set(cle, corps);
  afEcrireCache(cle, corps, afDuree(chemin));
  return corps;
}

/** API-Football désigne une saison par son année de début. */
function afSaisons(){
  const d = new Date(), a = d.getFullYear();
  return d.getMonth()+1 >= 7 ? [a, a-1] : [a-1, a];
}

const afNombre = v => (typeof v==='number' && Number.isFinite(v)) ? v
  : (typeof v==='string' && v.trim()!=='' && Number.isFinite(Number(v.replace('%','')))) ? Number(v.replace('%','')) : null;

function afVersMatch(brut){
  const f = brut.fixture || {}, l = brut.league || {}, t = brut.teams || {}, g = brut.goals || {};
  const court = (f.status && f.status.short) || 'NS';
  const statut = ['NS','TBD','PST'].includes(court) ? 'a_venir'
    : ['FT','AET','PEN','CANC','ABD','AWD','WO'].includes(court) ? 'termine' : 'en_cours';
  const nomCourt = e => (e && e.name ? e.name : 'Équipe').slice(0,3).toUpperCase();

  return {
    id: String(f.id),
    date: f.date || new Date().toISOString(),
    statut,
    competition: {
      id: String(l.id), nom: l.name || 'Compétition', pays: l.country || '',
      codePays: (l.country || '').slice(0,3).toUpperCase(),
      type: (l.type||'').toLowerCase()==='cup' ? 'coupe' : 'ligue'
    },
    domicile: {id:String((t.home||{}).id), nom:(t.home||{}).name||'Équipe', nomCourt:nomCourt(t.home), logo:(t.home||{}).logo||null},
    exterieur:{id:String((t.away||{}).id), nom:(t.away||{}).name||'Équipe', nomCourt:nomCourt(t.away), logo:(t.away||{}).logo||null},
    scoreDomicile: afNombre(g.home),
    scoreExterieur: afNombre(g.away),
    importance: null,
    stade: (f.venue && f.venue.name) || null
  };
}

/** Statistiques d'équipe, y compris les buts par côté et la forme. */
async function afStatsEquipe(equipeId, ligueId, saison){
  const corps = await afAppel('/teams/statistics', {team:equipeId, league:ligueId, season:saison});
  const r = corps.response || {};
  const fx = r.fixtures || {}, buts = r.goals || {};
  const pour = ((buts.for||{}).total)||{}, contre = ((buts.against||{}).total)||{};
  const joues = fx.played || {};

  const forme = String(r.form||'').slice(-10).split('').reverse()
    .map(c => c==='W' ? 'V' : c==='L' ? 'D' : 'N');

  const sommeCartes = bloc => {
    const entrees = Object.values(bloc || {});
    if(!entrees.length) return null;
    return entrees.reduce((a,v) => a + (afNombre((v||{}).total) || 0), 0);
  };

  return {
    matchsJoues: afNombre(joues.total) || 0,
    butsMarques: afNombre(pour.total) || 0,
    butsEncaisses: afNombre(contre.total) || 0,
    domicile: {matchs:afNombre(joues.home)||0, butsMarques:afNombre(pour.home)||0, butsEncaisses:afNombre(contre.home)||0},
    exterieur:{matchs:afNombre(joues.away)||0, butsMarques:afNombre(pour.away)||0, butsEncaisses:afNombre(contre.away)||0},
    forme,
    classement:null, points:null,
    possessionMoyenne:null, tirsParMatch:null, tirsCadresParMatch:null,
    xgPour:null, xgContre:null,
    cartonsJaunes: sommeCartes((r.cards||{}).yellow),
    cartonsRouges: sommeCartes((r.cards||{}).red),
    joursRepos:null, matchsRecents14j:null
  };
}

async function afClassement(ligueId, saison){
  const table = new Map();
  try{
    const corps = await afAppel('/standings', {league:ligueId, season:saison});
    const groupes = (((corps.response||[])[0]||{}).league||{}).standings || [];
    groupes.forEach(groupe => (groupe||[]).forEach(ligne => {
      table.set(String(((ligne||{}).team||{}).id), {rang:afNombre(ligne.rank), points:afNombre(ligne.points)});
    }));
  }catch{ /* coupes sans classement */ }
  return table;
}

/** Blessures et suspensions déclarées pour la rencontre. */
async function afAbsences(matchId){
  try{
    const corps = await afAppel('/injuries', {fixture:matchId});
    return (corps.response||[]).map(e => {
      const j = e.player||{}, eq = e.team||{};
      const type = String(j.type||'').toLowerCase();
      return {
        joueurId:String(j.id), nom:j.name||'Joueur', equipeId:String(eq.id),
        motif: type.includes('suspend') ? 'suspension' : type ? 'blessure' : 'autre',
        poste: j.position || null,
        importance: null
      };
    });
  }catch{ return []; }
}

/** Compositions probables ou officielles, selon la disponibilité. */
async function afCompositions(matchId){
  try{
    const corps = await afAppel('/fixtures/lineups', {fixture:matchId});
    const parEquipe = new Map();
    (corps.response||[]).forEach(bloc => {
      const eq = String((bloc.team||{}).id);
      const titulaires = (bloc.startXI||[]).map(x => String(((x||{}).player||{}).id));
      parEquipe.set(eq, {schema: bloc.formation || null, titulaires: new Set(titulaires)});
    });
    return parEquipe;
  }catch{ return new Map(); }
}

/** Effectif avec buts, passes et temps de jeu. */
async function afEffectif(equipeId, ligueId, saison){
  try{
    const corps = await afAppel('/players', {team:equipeId, league:ligueId, season:saison, page:1});
    return (corps.response||[]).map(e => {
      const j = e.player||{}, st = (e.statistics||[])[0]||{};
      return {
        id:String(j.id), nom:j.name||'Joueur',
        poste:((st.games||{}).position)||null,
        equipeId:String(equipeId),
        butsSaison: afNombre((st.goals||{}).total),
        passes: afNombre((st.goals||{}).assists),
        minutes: afNombre((st.games||{}).minutes),
        butsRecents: null,
        titulaire: null
      };
    }).filter(j => j.minutes === null || j.minutes > 0);
  }catch{ return []; }
}

async function afConfrontations(domicileId, exterieurId){
  try{
    const corps = await afAppel('/fixtures/headtohead', {h2h:`${domicileId}-${exterieurId}`, last:8});
    return (corps.response||[]).map(afVersMatch)
      .filter(m => m.scoreDomicile!==null && m.scoreExterieur!==null)
      .map(m => ({date:m.date, domicileId:m.domicile.id, exterieurId:m.exterieur.id,
                  butsDomicile:m.scoreDomicile, butsExterieur:m.scoreExterieur}));
  }catch{ return []; }
}

const FournisseurApiFootball = {
  nom: 'API-Football',
  fictif: false,

  async listerCompetitions(){
    // current=true : toutes les compétitions dont une saison est en cours.
    const corps = await afAppel('/leagues', {current:'true'});
    const toutes = (corps.response||[]).map(e => {
      const l = e.league||{}, p = e.country||{};
      return {
        id:String(l.id), nom:l.name||'Compétition',
        pays:p.name||'', codePays:(p.code || (p.name||'').slice(0,3) || '').toUpperCase(),
        logo:l.logo||null,
        type:(l.type||'').toLowerCase()==='cup' ? 'coupe' : 'ligue'
      };
    });

    // Les compétitions les plus suivies remontent en tête de liste.
    const rang = c => {
      const i = AF_PRIORITAIRES.findIndex(id => id === Number(c.id));
      return i === -1 ? 999 : i;
    };
    return toutes.sort((a,b) => rang(a) - rang(b)
      || a.pays.localeCompare(b.pays) || a.nom.localeCompare(b.nom));
  },

  /** Compétitions interrogées quand aucune n'est sélectionnée. */
  async liguesSuivies(){
    if(Array.isArray(Etat.suivies) && Etat.suivies.length) return Etat.suivies.slice(0, 10);
    return AF_SUIVIES_DEFAUT.map(String);
  },

  async listerMatchs(competitionId){
    const ligues = competitionId ? [competitionId] : await this.liguesSuivies();

    // Toutes les compétitions suivies sont interrogées en parallèle,
    // sinon un seul championnat occupe tout l'écran.
    const lots = await Promise.all(ligues.map(async id => {
      for(const saison of afSaisons()){
        try{
          const corps = await afAppel('/fixtures', {league:id, season:saison, next:15});
          const liste = (corps.response||[]).map(afVersMatch);
          if(liste.length) return liste;
        }catch{ /* compétition indisponible sur ce plan */ }
      }
      return [];
    }));

    return lots.flat().sort((a,b) => a.date.localeCompare(b.date)).slice(0, 60);
  },

  async obtenirMatch(id){
    const corps = await afAppel('/fixtures', {id});
    const premier = (corps.response||[])[0];
    return premier ? afVersMatch(premier) : null;
  },

  async construireDossier(id){
    const match = await this.obtenirMatch(id);
    if(!match) return null;

    const ligue = match.competition.id;
    const saison = afSaisons()[0];
    const manquants = [];

    const [statsD, statsE, classement, absences, compositions, effectifD, effectifE, h2h] =
      await Promise.all([
        afStatsEquipe(match.domicile.id, ligue, saison).catch(() => null),
        afStatsEquipe(match.exterieur.id, ligue, saison).catch(() => null),
        afClassement(ligue, saison),
        afAbsences(id),
        afCompositions(id),
        afEffectif(match.domicile.id, ligue, saison),
        afEffectif(match.exterieur.id, ligue, saison),
        afConfrontations(match.domicile.id, match.exterieur.id)
      ]);

    if(!statsD || !statsE) throw new Error('Statistiques d’équipe indisponibles pour cette compétition.');

    const rD = classement.get(match.domicile.id), rE = classement.get(match.exterieur.id);
    if(rD){ statsD.classement = rD.rang; statsD.points = rD.points; } else manquants.push('classement');
    if(rE){ statsE.classement = rE.rang; statsE.points = rE.points; }

    // Un joueur annoncé titulaire pèse davantage dans l'analyse.
    const marquerTitulaires = (effectif, equipeId) => {
      const bloc = compositions.get(equipeId);
      if(!bloc) return effectif;
      return effectif.map(j => ({...j, titulaire: bloc.titulaires.has(j.id)}));
    };

    // Le poids d'une absence est déduit du temps de jeu réel, pas inventé.
    const tousJoueurs = [...effectifD, ...effectifE];
    const minutesMax = Math.max(1, ...tousJoueurs.map(j => j.minutes || 0));
    const absencesPesees = absences.map(a => {
      const j = tousJoueurs.find(x => x.id === a.joueurId);
      return {...a, importance: j && j.minutes ? borner(j.minutes / minutesMax, 0.15, 1) : null};
    });

    if(!absences.length) manquants.push('absences et blessures');
    if(!compositions.size) manquants.push('compositions probables (publiées ~1 h avant le coup d’envoi)');
    if(!h2h.length) manquants.push('confrontations directes');
    manquants.push('expected goals (non fournis par API-Football)');
    manquants.push('possession, tirs et tirs cadrés');
    manquants.push('jours de récupération');

    return {
      match,
      statsDomicile: statsD,
      statsExterieur: statsE,
      joueursDomicile: marquerTitulaires(effectifD, match.domicile.id),
      joueursExterieur: marquerTitulaires(effectifE, match.exterieur.id),
      absences: absencesPesees,
      confrontations: h2h,
      moyenneButsCompetition: null,
      champsManquants: manquants,
      donneesFictives: false
    };
  },

  async listerActualites(){ return []; }
};

/** Élément signature : la distribution complète des scores en grille lumineuse. */
function matriceScores(matrice, codeD, codeE, retenus){
  const max = Math.max(...matrice.flat(), 0.001);
  const set = new Set(retenus);
  let cases = '';
  for(let d=0; d<matrice.length; d++) for(let e=0; e<matrice[d].length; e++){
    const v = matrice[d][e], score = `${d}-${e}`;
    const alpha = 0.05 + Math.min(1, v/max)*0.85;
    cases += `<button class="${set.has(score)?'retenu':''}" data-action="survol-score" data-score="${score}" data-valeur="${v}"
      style="background:rgba(46,107,255,${alpha})"
      aria-label="Score ${d} contre ${e}, ${v.toFixed(2)} pour cent"></button>`;
  }
  return `<section class="carte p4">
    <div class="entre" style="align-items:baseline">
      <h2 class="etiquette">Matrice des scores exacts</h2>
      <span class="chiffres petit doux" id="detail-score">49 issues modélisées</span>
    </div>
    <p class="tpetit doux" style="margin:.25rem 0 1rem">Chaque case est un score possible, de 0-0 à 6-6.
    Plus elle est lumineuse, plus ce score est probable. Les trois scénarios retenus sont entourés.</p>
    <div class="rangee" style="align-items:stretch;gap:.5rem">

        font-size:.6rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--faible)">${ech(codeD)}</span>
      <div style="min-width:0;flex:1">
        <div class="matrice">${cases}</div>
        <div class="axe chiffres">${[0,1,2,3,4,5,6].map(n=>`<span>${n}</span>`).join('')}</div>
        <p class="centre" style="margin-top:.25rem;font-size:.6rem;font-weight:600;letter-spacing:.15em;
          text-transform:uppercase;color:var(--faible)">${ech(codeE)}</p>
      </div>
    </div>
  </section>`;
}

function graphiqueButs(lD, lE, codeD, codeE){
  const serie = l => [0,1,2,3,4,5].map(k => k===5
    ? Math.max(0, 1 - [0,1,2,3,4].reduce((a,i)=>a+poisson(i,l), 0))
    : poisson(k,l));
  const sD = serie(lD), sE = serie(lE);
  const max = Math.max(...sD, ...sE, 0.01);
  const colonnes = [0,1,2,3,4,5].map(k=>`<div>
      <div class="paire">
        <i style="height:${sD[k]/max*100}%;background:var(--bleu)" title="${ech(codeD)} ${(sD[k]*100).toFixed(1)} %"></i>
        <i style="height:${sE[k]/max*100}%;background:var(--rouge)" title="${ech(codeE)} ${(sE[k]*100).toFixed(1)} %"></i>
      </div>
    </div>`).join('');
  return `<section class="carte p4">
    <h2 class="etiquette">Buts par équipe</h2>
    <p class="tpetit doux" style="margin:.25rem 0 1rem">Probabilité que chaque équipe inscrive exactement ce nombre de buts.</p>
    <div class="barres">${colonnes}</div>
    <div class="grille2" style="grid-template-columns:repeat(6,1fr);gap:.5rem">
      ${[0,1,2,3,4,'5+'].map(n=>`<span class="etq">${n}</span>`).join('')}
    </div>
    <div class="rangee centre" style="justify-content:center;gap:1.25rem;margin-top:.75rem">
      <span class="petit doux"><span class="point" style="display:inline-block;background:var(--bleu);border-radius:2px;width:8px;height:8px"></span> ${ech(codeD)}</span>
      <span class="petit doux"><span class="point" style="display:inline-block;background:var(--rouge);border-radius:2px;width:8px;height:8px"></span> ${ech(codeE)}</span>
    </div>
  </section>`;
}

/* ── 8. Navigation et rendu ────────────────────────────────── */

const ONGLETS = [
  {id:'accueil',      libelle:'Accueil',      icone:'accueil'},
  {id:'matchs',       libelle:'Matchs',       icone:'matchs'},
  {id:'competitions', libelle:'Compétitions', icone:'trophee'},
  {id:'actus',        libelle:'Actus',        icone:'actus'},
  {id:'compte',       libelle:'Compte',       icone:'compte'}
];

/** L'écran de prédiction reste rattaché à l'onglet Matchs. */
function ongletActif(){
  if(Etat.ecran==='prediction') return 'matchs';
  if(Etat.ecran==='parametres') return 'compte';
  return Etat.ecran;
}

function rendreOnglets(){
  const actif = ongletActif();
  document.getElementById('onglets').innerHTML = ONGLETS.map(o=>
    `<button class="${o.id===actif?'actif':''}" data-action="aller" data-ecran="${o.id}"
      ${o.id===actif?'aria-current="page"':''}>${icone(o.icone,20)}<span>${o.libelle}</span></button>`).join('');
}

const ECRANS = {
  accueil: ecranAccueil,
  matchs: ecranMatchs,
  competitions: ecranCompetitions,
  actus: ecranActus,
  compte: async () => ecranCompte(),
  parametres: async () => ecranParametres(),
  prediction: ecranPrediction
};

let rendus = 0;

async function rendre(){
  const conteneur = document.getElementById('ecran');
  const jeton = ++rendus;

  if(Etat.ecran==='prediction'){
    conteneur.innerHTML = enTete('Prédiction','',{retour:true}) + chargement('Calcul du modèle statistique…');
    rendreOnglets();
  }

  try{
    const html = await (ECRANS[Etat.ecran] || ECRANS.accueil)();
    if(jeton !== rendus) return;              // un rendu plus récent a pris la main
    conteneur.innerHTML = html;
  }catch(e){
    if(jeton !== rendus) return;
    const brut = String(e && e.message || e);
    const message = /Failed to fetch|Load failed|NetworkError/i.test(brut)
      ? 'Impossible de joindre la source de données. Vérifiez votre connexion, '
        + 'ou repassez en mode démonstration dans Paramètres.'
      : brut.includes('TheSportsDB') || brut.includes('Quota')
        ? brut
        : 'Cet écran n’a pas pu s’afficher. Réessayez ; si le problème persiste, rechargez la page.';
    conteneur.innerHTML = enTete('FootVision AI','',{reglages:true}) + etatErreur(message);
  }

  rendreOnglets();
  window.scrollTo({top:0, behavior:'instant'});
  const focus = document.querySelector('h1');
  if(focus) focus.setAttribute('tabindex','-1');
}

function aller(ecran, options={}){
  if(ecran==='matchs' && !options.garderCompetition) Etat.competitionActive = null;
  Etat.ecran = ecran;
  if(options.matchId) Etat.matchId = options.matchId;
  location.hash = ecran==='prediction' ? `#/match/${Etat.matchId}` : `#/${ecran}`;
  rendre();
}

function lireHash(){
  const h = location.hash.replace(/^#\/?/, '');
  if(h.startsWith('match/')){
    Etat.matchId = h.slice(6);
    Etat.ecran = 'prediction';
    return;
  }
  Etat.ecran = ECRANS[h] ? h : 'accueil';
}

/* ── 9. Interactions ───────────────────────────────────────── */

document.addEventListener('click', e => {
  const cible = e.target.closest('[data-action]');
  if(!cible) return;
  const action = cible.dataset.action;

  switch(action){
    case 'aller':
      aller(cible.dataset.ecran);
      break;

    case 'retour':
      history.length > 1 ? history.back() : aller('accueil');
      break;

    case 'recharger':
      rendre();
      break;

    case 'ouvrir-match':
      Etat.matchId = cible.dataset.id;
      aller('prediction');
      break;

    case 'suivre': {
      const id = cible.dataset.id;
      const liste = Etat.suivies || [];
      Etat.suivies = liste.includes(id) ? liste.filter(x => x !== id) : [...liste, id];
      Etat.liguesSuivies = null;
      sauverSession();
      rendre();
      break;
    }

    case 'ouvrir-competition':
      Etat.competitionActive = cible.dataset.id;
      Etat.filtreMatch = 'tous';
      aller('matchs', {garderCompetition:true});
      break;

    case 'filtre-match':
      Etat.filtreMatch = cible.dataset.valeur;
      rendre();
      break;

    case 'filtre-competition':
      Etat.filtreCompetition = cible.dataset.valeur;
      rendre();
      break;

    case 'basculer-visibilite': {
      const champ = document.getElementById('champ-cle');
      if(champ) Etat.cle = champ.value;
      Etat.cleVisible = !Etat.cleVisible;
      rendre();
      break;
    }

    case 'enregistrer-cle': {
      const champ = document.getElementById('champ-cle');
      Etat.cle = champ ? champ.value.trim() : '';
      sauverSession();
      annoncer(Etat.cle ? 'Clé enregistrée pour cette application.' : 'Aucune clé saisie.', !!Etat.cle);
      rendre();
      break;
    }

    case 'effacer-cle':
      Etat.cle = '';
      sauverSession();
      annoncer('Clé effacée.', true);
      rendre();
      break;

    case 'mode-conservation': {
      const champ = document.getElementById('champ-cle');
      if(champ) Etat.cle = champ.value.trim();
      Etat.conserver = cible.dataset.valeur === 'session';
      sauverSession();
      rendre();
      break;
    }

    case 'enregistrer-modele': {
      const champ = document.getElementById('champ-modele');
      Etat.modele = (champ && champ.value.trim()) || MODELE_DEFAUT;
      sauverSession();
      annoncer(`Modèle défini sur « ${Etat.modele} ».`, true);
      rendre();
      break;
    }

    case 'source': {
      const champ = document.getElementById('champ-cle');
      if(champ) Etat.cle = champ.value.trim();
      definirSource(cible.dataset.valeur);
      annoncer(
        Etat.source==='espn' ? 'Source basculée sur ESPN. Aucune clé, aucun quota.'
        : Etat.source==='proxy' ? 'Source basculée sur API-Football. Blessures officielles disponibles.'
        : Etat.source==='reelle' ? 'Source basculée sur TheSportsDB. Couverture limitée à cinq championnats.'
        : 'Source basculée sur les données de démonstration.', true);
      rendre();
      break;
    }

    case 'enregistrer-proxy': {
      const urlChamp = document.getElementById('champ-proxy');
      const jetonChamp = document.getElementById('champ-jeton');
      Etat.proxy = urlChamp ? urlChamp.value.trim().replace(/\/+$/, '') : '';
      Etat.jetonProxy = jetonChamp ? jetonChamp.value.trim() : '';
      cacheAf.clear();
      sauverSession();
      if(Etat.proxy) testerProxy(); else { annoncer('Proxy retiré.', true); rendre(); }
      break;
    }

    case 'enregistrer-foot': {
      const champ = document.getElementById('champ-foot');
      Etat.cleFoot = champ ? champ.value.trim() : '';
      cacheAf.clear();
      sauverSession();
      annoncer(Etat.cleFoot
        ? 'Clé football enregistrée. Choisissez la source API-Football ci-dessus.'
        : 'Clé football retirée.', true);
      rendre();
      break;
    }

    case 'vider-cache':
      cacheAf.clear();
      afPurgerCache(1);
      annoncer('Cache vidé. Les prochaines données seront rechargées depuis l’API.', true);
      rendre();
      break;

    case 'basculer-ia':
      Etat.analyseIA = !Etat.analyseIA;
      sauverSession();
      rendre();
      break;

    case 'tester-cle':
      testerCle();
      break;
  }
});

/**
 * Message de retour dans l'écran Paramètres.
 * Il est mémorisé dans l'état : sans cela, un re-rendu déclenché juste après
 * effaçait le message avant même qu'il soit lisible.
 */
function annoncer(message, succes){
  Etat.message = message ? {texte:message, succes:!!succes} : null;
  const zone = document.getElementById('retour-test');
  if(!zone) return;
  zone.textContent = message || '';
  zone.style.color = succes ? 'var(--bleu)' : 'var(--rouge)';
  zone.setAttribute('role','status');
}

/** Interroge /sante sur le Worker : confirme l'URL, le jeton et les clés présentes. */
async function testerProxy(){
  const base = (Etat.proxy || '').replace(/\/+$/, '');
  if(!base) return annoncer('Renseignez d’abord l’URL du proxy.', false);

  try{
    const entetes = {};
    if(Etat.jetonProxy) entetes['x-jeton'] = Etat.jetonProxy;
    const reponse = await fetch(base + '/sante', {headers: entetes});
    const corps = await reponse.json().catch(() => null);

    if(reponse.status===401) return finProxy('Jeton refusé par le proxy. Vérifiez la variable JETON du Worker.', false);
    if(reponse.status===403) return finProxy('Origine refusée. Ajoutez cette adresse à ORIGINES_AUTORISEES dans le Worker.', false);
    if(!reponse.ok || !corps) return finProxy(`Proxy injoignable (${reponse.status}). Vérifiez l’URL.`, false);

    const manque = [];
    if(!corps.football) manque.push('CLE_FOOTBALL');
    if(!corps.anthropic) manque.push('CLE_ANTHROPIC');
    finProxy(manque.length
      ? `Proxy joignable, mais il manque : ${manque.join(', ')}. Ajoutez-les en variables secrètes.`
      : 'Proxy opérationnel. Clés football et Anthropic détectées côté serveur.',
      manque.length === 0);
  }catch{
    finProxy('Proxy injoignable. Vérifiez l’URL et que le Worker est déployé.', false);
  }
}

function finProxy(message, succes){ annoncer(message, succes); rendre(); }

/** Vérifie la clé avec l'appel le plus court possible. */
async function testerCle(){
  const champ = document.getElementById('champ-cle');
  const candidate = ((champ && champ.value.trim()) || Etat.cle).trim();
  const bouton = document.getElementById('bouton-test');
  const cible = cibleClaude(candidate);

  if(!cible.viaProxy){
    if(!candidate) return annoncer('Saisissez d’abord une clé.', false);
    if(!candidate.startsWith('sk-ant-'))
      return annoncer('Format invalide : une clé Anthropic commence par « sk-ant- ».', false);
  }

  if(bouton){ bouton.disabled = true; bouton.textContent = 'Test en cours…'; }
  annoncer('', true);

  try{
    const reponse = await fetch(cible.url, {
      method:'POST',
      headers: cible.entetes,
      body: JSON.stringify({
        model: Etat.modele || MODELE_DEFAUT,
        max_tokens: 8,
        messages:[{role:'user', content:'Réponds uniquement : ok'}]
      })
    });

    if(reponse.ok){
      if(!cible.viaProxy) Etat.cle = candidate;
      sauverSession();
      annoncer(`Connexion établie avec le modèle ${Etat.modele}`
        + (cible.viaProxy ? ', via le proxy. Votre clé ne transite plus par le navigateur.' : '.'), true);
    } else {
      annoncer(await messageErreurApi(reponse), false);
    }
  }catch(e){
    annoncer(messageErreurReseau(e), false);
  }finally{
    if(bouton){ bouton.disabled = false; bouton.textContent = 'Tester la connexion'; }
  }
}

/* Recherche de compétition : filtrage sans perdre le focus du champ. */
document.addEventListener('input', e => {
  if(e.target.id === 'recherche'){
    Etat.recherche = e.target.value;
    clearTimeout(window.__minuteurRecherche);
    window.__minuteurRecherche = setTimeout(async () => {
      const html = await ecranCompetitions();
      document.getElementById('ecran').innerHTML = html;
      const champ = document.getElementById('recherche');
      if(champ){ champ.focus(); champ.setSelectionRange(champ.value.length, champ.value.length); }
    }, 180);
  }
});

/* Détail au survol d'une case de la matrice de scores. */
document.addEventListener('mouseover', e => {
  const c = e.target.closest('[data-action="survol-score"]');
  const zone = document.getElementById('detail-score');
  if(c && zone) zone.textContent = `${c.dataset.score} · ${Number(c.dataset.valeur).toFixed(2)} %`;
});
document.addEventListener('mouseout', e => {
  if(e.target.closest('[data-action="survol-score"]')){
    const zone = document.getElementById('detail-score');
    if(zone) zone.textContent = '49 issues modélisées';
  }
});

window.addEventListener('hashchange', () => { lireHash(); rendre(); });

chargerSession();
appliquerSource();
lireHash();
rendre();
